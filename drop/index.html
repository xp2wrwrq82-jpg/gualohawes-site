<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>the drop</title>
<meta name="theme-color" content="#f3f3f4">
<link rel="icon" href="/sycstem/mark.svg" type="image/svg+xml">
<style>
  /* gualo.site/drop — what the invited can get. The products float in a deep white space: the one at the focal
     distance is sharp, the ones behind go soft into white haze, the ones you pass blur away. Scroll = fly forward. */
  :root {
    --ink: #1d1d1f; --grey: #6e6e73; --soft: #a1a1a6; --line: #4a4a4f; --fine: #8e8e93;
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.22,.61,.36,1);
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #f3f3f4; overscroll-behavior: none; scroll-snap-type: y proximity; }
  #snaps { position: absolute; left: 0; top: 0; width: 1px; pointer-events: none; }
  #snaps i { display: block; height: 62vh; scroll-snap-align: start; }
  body { min-height: 100%; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; background: #f3f3f4; }
  ::selection { background: #1d1d1f; color: #fff; }

  /* the room: soft studio light from above, a floor of haze */
  .room { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(90% 70% at 50% 22%, #ffffff 0%, #f6f6f7 46%, #ececee 100%); }
  .room::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
    background: linear-gradient(to top, rgba(232,232,235,.9), rgba(243,243,244,0)); }

  #space { position: fixed; inset: 0; z-index: 1; perspective: 1300px; perspective-origin: 50% 44%; overflow: hidden; }
  #world { position: absolute; left: 50%; top: 46%; transform-style: preserve-3d; will-change: transform; }
  .p { position: absolute; left: 0; top: 0; transform-style: preserve-3d; will-change: transform, filter, opacity; cursor: pointer; }
  .p .card { position: relative; width: var(--w); border-radius: var(--r); overflow: hidden; background: #111;
    transform: rotateY(var(--ry)) rotateX(var(--rx)); transition: transform .9s var(--ease);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14), 0 50px 90px -20px rgba(18,18,28,.38), 0 18px 34px -12px rgba(18,18,28,.28); }
  .p .card img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  /* a sheen that slides as it turns — the glass catches the light */
  .p .card::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 68%, rgba(255,255,255,.06) 100%); }
  .p .floor { position: absolute; left: 12%; right: 12%; height: 40px; bottom: -70px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(20,20,30,.22), rgba(20,20,30,0)); filter: blur(10px); }
  .p .nm { position: absolute; left: 0; right: 0; bottom: -38px; text-align: center; font-size: 13px; letter-spacing: .06em; color: var(--line);
    opacity: 0; transform: translateY(6px); transition: opacity .5s var(--ease), transform .5s var(--ease); }
  .p:hover .card, .p.focus .card { transform: rotateY(0deg) rotateX(0deg) scale(1.03); }
  .p:hover .nm, .p.focus .nm { opacity: 1; transform: none; }

  /* the line + the fine print, quiet over everything */
  .line { position: fixed; z-index: 3; left: 0; right: 0; top: calc(26px + env(safe-area-inset-top, 0px)); text-align: center; font-size: 14px; letter-spacing: .06em; color: var(--line); pointer-events: none; }
  .line span { display: inline-block; opacity: 0; filter: blur(6px); animation: letter 1.4s var(--ease) forwards; }
  .line span.sp { width: .32em; }
  @keyframes letter { to { opacity: 1; filter: none; } }
  .fine { position: fixed; z-index: 3; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 11px; letter-spacing: .04em; color: var(--fine);
    pointer-events: none; opacity: 0; animation: appear 1.6s var(--ease) 2.2s forwards; }
  .draft { position: fixed; z-index: 3; left: 0; right: 0; text-align: center; top: calc(50px + env(safe-area-inset-top, 0px)); font-size: 11px; letter-spacing: .06em; color: var(--fine); }
  @keyframes appear { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: none; } }

  /* one product, up close: a glass sheet */
  #detail { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; pointer-events: none; }
  #detail .scrim { position: absolute; inset: 0; background: rgba(243,243,244,.55); backdrop-filter: blur(18px) saturate(1.1); -webkit-backdrop-filter: blur(18px) saturate(1.1);
    opacity: 0; transition: opacity .5s var(--ease); }
  #detail .sheet { position: relative; width: min(860px, 100%); max-height: calc(100% - 20px); overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center;
    padding: 36px; border-radius: 28px; background: rgba(255,255,255,.72); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08), 0 40px 120px rgba(20,20,30,.18);
    opacity: 0; filter: blur(10px); transform: translateY(18px) scale(.98); transition: opacity .5s var(--ease), filter .5s var(--ease), transform .6s var(--ease); }
  #detail.on { pointer-events: auto; }
  #detail.on .scrim { opacity: 1; }
  #detail.on .sheet { opacity: 1; filter: none; transform: none; }
  #detail .shot { justify-self: center; width: 100%; max-width: 360px; border-radius: 18px; overflow: hidden; transform: perspective(1100px) rotateY(-8deg) rotateX(3deg);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14), 0 40px 70px -20px rgba(18,18,28,.4); }
  #detail .shot img { display: block; width: 100%; }
  #detail .kind { font-size: 11px; letter-spacing: .08em; color: var(--fine); text-transform: lowercase; }
  #detail h2 { margin-top: 10px; font-size: 34px; font-weight: 600; letter-spacing: -.01em; }
  #detail .tag { margin-top: 10px; font-size: 15px; line-height: 1.45; color: var(--grey); }
  #detail .get { margin-top: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; padding: 0 28px; border-radius: 999px;
    background: var(--ink); color: #fff; font: 500 15px var(--sans); text-decoration: none; box-shadow: 0 14px 34px rgba(20,20,30,.22); transition: transform .3s var(--ease), box-shadow .3s; }
  #detail .get:hover { transform: translateY(-1px); box-shadow: 0 18px 40px rgba(20,20,30,.28); }
  #detail .get.soon { background: rgba(255,255,255,.85); color: var(--grey); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.1); cursor: default; }
  #detail .x { position: absolute; right: 18px; top: 16px; border: 0; background: none; font: 400 12px var(--sans); letter-spacing: .04em; color: var(--fine); cursor: pointer; }
  #detail .x:hover { color: var(--ink); }
  @media (max-width: 720px) {
    #detail .sheet { grid-template-columns: 1fr; gap: 24px; padding: 28px 22px 26px; text-align: center; }
    #detail .shot { max-width: 260px; transform: perspective(1100px) rotateX(4deg); }
    #detail h2 { font-size: 28px; }
  }
  #soon { position: fixed; inset: 0; z-index: 2; display: none; place-items: center; font-size: 14px; letter-spacing: .06em; color: var(--line); }
  body.locked #soon { display: grid; }
  body.locked #space, body.locked .line { display: none; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .line span, .fine { opacity: 1; filter: none; } }
</style>
</head>
<body>
<div class="room" aria-hidden="true"></div>
<div id="snaps" aria-hidden="true"></div>
<div id="space" aria-label="Products"><div id="world"></div></div>
<p class="line" id="line">the drop.</p>
<div class="draft" id="draft" hidden>draft · only you can see this</div>
<div id="soon">soon.</div>
<p class="fine">Technology by Gualo Hawes</p>

<div id="detail" aria-hidden="true">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dName">
    <button class="x" id="dClose" type="button">close</button>
    <div class="shot"><img id="dImg" alt=""></div>
    <div><div class="kind" id="dKind"></div><h2 id="dName"></h2><p class="tag" id="dTag"></p><a class="get" id="dGet" target="_blank" rel="noopener">Get</a></div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var API = 'https://vault-y6mf.vercel.app/api';
  // the products: real UI 6 screens (the apps' own windows, the plugins' own panels)
  var SHOTS = { bucket: [900, 1200], aim: [840, 696], prism: [920, 1249], stash: [920, 1249] };
  ['fx', 'texture', 'film', 'vhs', 'grade', 'lut', 'collage', 'sync', 'mask', 'ramp', 'transition', 'gimbal', 'mix'].forEach(function (k) { SHOTS[k] = [920, 1572]; });
  var DEFAULT = { mode: 'live', line: 'the drop.', items: [
    { key: 'bucket', on: true, name: 'Bucket', kind: 'app', tag: 'drop anything. it sorts itself.' },
    { key: 'prism', on: true, name: 'Prism', kind: 'app', tag: 'camera files, converted exactly.' },
    { key: 'stash', on: true, name: 'Stash', kind: 'app', tag: 'links into a library.' },
    { key: 'aim', on: true, name: 'Aim', kind: 'app', tag: 'your controller is the mouse.' },
    { key: 'fx', on: true, name: 'FX', kind: 'plugin', tag: 'motion, on the beat.' },
    { key: 'mask', on: true, name: 'Mask', kind: 'plugin', tag: 'cut out anything.' },
    { key: 'transition', on: true, name: 'Transition', kind: 'plugin', tag: 'cuts that move.' },
    { key: 'sync', on: true, name: 'Sync', kind: 'plugin', tag: 'every take in sync. cut on the beat.' }] };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function line(txt) {
    var el = $('line'), html = '', d = .5;
    for (var i = 0; i < txt.length; i++) { var ch = txt[i]; html += ch === ' ' ? '<span class="sp" style="animation-delay:' + d.toFixed(2) + 's">&nbsp;</span>' : '<span style="animation-delay:' + d.toFixed(2) + 's">' + esc(ch) + '</span>'; d += ch === '.' ? .32 : .06; }
    el.innerHTML = html;
  }

  /* ── the depth field ── */
  var P = [], N = 0, GAP = 680, world = $('world');
  // a hand-made composition (never random — random reads as debris): side, height, turn
  var LAY = [[-.24, .02, 14], [.26, -.10, -16], [-.30, .14, 12], [.18, .10, -10], [-.12, -.12, 8], [.32, .04, -18], [-.28, -.04, 16], [.12, .16, -8],
             [-.20, .12, 12], [.28, -.14, -14], [-.34, .0, 18], [.22, .08, -12], [-.10, -.16, 6], [.30, .14, -16], [-.26, .06, 14], [.16, -.06, -10], [-.18, .1, 10]];
  function build(items) {
    world.innerHTML = ''; P = [];
    items.forEach(function (it, i) {
      var s = SHOTS[it.key]; if (!s) return;
      var L = LAY[i % LAY.length], el = document.createElement('figure');
      var app = it.kind === 'app', w = it.key === 'aim' ? 320 : it.key === 'bucket' ? 280 : app ? 400 : 300;
      el.className = 'p'; el.tabIndex = 0;
      el.style.setProperty('--w', w + 'px'); el.style.setProperty('--r', (app && it.key !== 'aim' && it.key !== 'bucket' ? 16 : 14) + 'px');
      el.style.setProperty('--ry', L[2] + 'deg'); el.style.setProperty('--rx', (i % 2 ? -3 : 3) + 'deg');
      el.innerHTML = '<div class="floor"></div><div class="card"><img src="/drop/shots/' + it.key + '.webp" width="' + s[0] + '" height="' + s[1] + '" alt="' + esc(it.name) + '" loading="' + (i < 4 ? 'eager' : 'lazy') + '" decoding="async"></div><figcaption class="nm">' + esc(it.name.toLowerCase()) + '</figcaption>';
      el.addEventListener('click', function () { open(it); });
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') open(it); });
      world.appendChild(el);
      P.push({ el: el, it: it, x: L[0], y: L[1], z: -i * GAP, w: w, h: w * s[1] / s[0], t1: 6.5 + (i * 1.37) % 3.2, t2: 8 + (i * 2.11) % 4, ph: i * 1.7, blur: -1, op: -1 });
    });
    N = P.length;
    document.body.style.height = 'calc(100vh + ' + Math.max(0, N - 1) * 62 + 'vh)';
    $('snaps').innerHTML = new Array(N + 1).join('<i></i>');
  }

  var mx = 0, my = 0, ex = 0, ey = 0, zCam = 0, zGoal = 0, focusKey = null;
  window.addEventListener('pointermove', function (e) { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; }, { passive: true });
  function scrollTarget() { return Math.max(0, Math.min((N - 1) * GAP, scrollY / (innerHeight * .62) * GAP)); }
  window.addEventListener('scroll', function () { zGoal = scrollTarget(); }, { passive: true });

  function frame(t) {
    var s = t / 1000, W = innerWidth, H = innerHeight, phone = W < 720, spread = phone ? .62 : 1;
    zCam += (zGoal - zCam) * .085;                                   // the camera eases forward
    ex += (mx - ex) * .05; ey += (my - ey) * .05;                    // the room tilts with you
    world.style.transform = 'rotateY(' + (ex * 5).toFixed(3) + 'deg) rotateX(' + (-ey * 3.5).toFixed(3) + 'deg)';
    var scale = phone ? Math.min(1, W / 520) : 1;
    for (var i = 0; i < N; i++) {
      var p = P[i], z = p.z + zCam;                                  // 0 = the focal plane
      var x = p.x * W * spread, y = p.y * H + Math.sin(s / p.t1 + p.ph) * 12, ry = Math.sin(s / p.t2 + p.ph) * 1.6;
      // depth of field + atmosphere: soft and pale behind, soft and gone once it passes you
      var far = Math.max(0, -z), near = Math.max(0, z);
      var blur = Math.min(10, Math.max(0, far - 160) / 300 + Math.max(0, near - 90) / 70);
      var op = Math.max(0, Math.min(1, 1 - (far - 2200) / 1400)) * Math.max(0, Math.min(1, 1 - (near - 260) / 260));
      var bright = 1 + Math.min(.22, far / 9000);
      p.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,' + z.toFixed(1) + 'px) translate(-50%,-50%) rotateY(' + ry.toFixed(2) + 'deg) scale(' + scale.toFixed(3) + ')';
      if (Math.abs(blur - p.blur) > .2 || Math.abs(op - p.op) > .02) {
        p.el.style.filter = 'blur(' + blur.toFixed(1) + 'px) brightness(' + bright.toFixed(3) + ')'; p.el.style.opacity = op.toFixed(3);
        p.el.style.visibility = op < .01 ? 'hidden' : 'visible'; p.el.style.pointerEvents = op < .3 ? 'none' : '';
        p.el.style.zIndex = String(10000 + Math.round(z)); p.blur = blur; p.op = op;
      }
    }
    requestAnimationFrame(frame);
  }

  /* ── one product, up close ── */
  function open(it) {
    $('dImg').src = '/drop/shots/' + it.key + '.webp'; $('dImg').alt = it.name;
    $('dKind').textContent = (it.kind === 'app' ? 'mac app' : 'premiere plugin') + ' · beta';
    $('dName').textContent = it.name; $('dTag').textContent = it.tag || '';
    var g = $('dGet');
    if (it.href) { g.href = it.href; g.textContent = it.cta || 'Get'; g.classList.remove('soon'); g.removeAttribute('aria-disabled'); }
    else { g.removeAttribute('href'); g.textContent = 'soon'; g.classList.add('soon'); g.setAttribute('aria-disabled', 'true'); }
    $('detail').classList.add('on'); $('detail').setAttribute('aria-hidden', 'false');
  }
  function close() { $('detail').classList.remove('on'); $('detail').setAttribute('aria-hidden', 'true'); }
  $('scrim').addEventListener('click', close); $('dClose').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  /* ── what to show: live → everyone; draft → only the admin (signed in on this browser) ── */
  var session = null; try { session = JSON.parse(localStorage.getItem('syc_admin') || 'null'); } catch (e) {}
  function show(d, isDraft) {
    var items = (d.items || []).filter(function (i) { return i.on && SHOTS[i.key]; });
    line(d.line || 'the drop.'); build(items); zGoal = scrollTarget(); $('draft').hidden = !isDraft;
  }
  function lock() { document.body.classList.add('locked'); document.body.style.height = '100%'; }
  function load() {
    if (session && session.token) {
      return fetch(API + '/beta/admin/drop', { headers: { Authorization: 'Bearer ' + session.token }, cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (j) { show(j.drop, j.drop.mode !== 'live'); })
        .catch(function () { session = null; return load(); });
    }
    return fetch(API + '/site/drop', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.drop && j.drop.mode === 'live') show(j.drop, false); else lock();
    }).catch(lock);
  }
  load().then(function () { requestAnimationFrame(frame); });

  try {   // one anonymous visit count
    var first = !sessionStorage.getItem('syc_seen'); sessionStorage.setItem('syc_seen', '1');
    var ref = ''; try { ref = document.referrer ? new URL(document.referrer).host : ''; } catch (e) {}
    var q = new URLSearchParams(location.search), src = (q.get('ref') || q.get('utm_source') || (/instagram/i.test(navigator.userAgent) ? 'ig' : '')).slice(0, 24);
    if (navigator.sendBeacon) navigator.sendBeacon(API + '/site/hit', new Blob([JSON.stringify({ page: 'drop', src: src, ref: ref, first: first })], { type: 'text/plain' }));
  } catch (e) {}
  window.__DROP_DEFAULT = DEFAULT;   // used by local previews
})();
</script>
</body>
</html>
