<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYCSTEM</title>
<meta name="description" content="Private beta. Request access.">
<meta name="theme-color" content="#050505">
<meta property="og:type" content="website">
<meta property="og:title" content="SYCSTEM">
<meta property="og:description" content="Private beta. Request access.">
<meta property="og:url" content="https://sycstem.vercel.app/">
<meta property="og:image" content="https://sycstem.vercel.app/sycstem/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:image" content="https://sycstem.vercel.app/sycstem/og.png">
<link rel="icon" href="/sycstem/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #050505; --ink: #e7e7e2; --dim: rgba(231,231,226,.56); --faint: rgba(231,231,226,.14); --hair: rgba(231,231,226,.08);
    --blue: #1f38ff; --blue-ink: #7d8dff;
    --disp: 'Michroma', 'Eurostile', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'Avenir Next', 'Helvetica Neue', system-ui, -apple-system, Arial, sans-serif;
    --ease: cubic-bezier(.22,.61,.36,1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--void); color: var(--ink); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
  ::selection { background: var(--blue); color: #fff; }

  /* the room: a slow light behind everything, no texture painted on */
  .glow { position: fixed; inset: -20vmax; pointer-events: none; z-index: 0;
    background: radial-gradient(42vmax 34vmax at 50% 42%, rgba(31,56,255,.20), transparent 70%),
                radial-gradient(30vmax 24vmax at 50% 46%, rgba(231,231,226,.05), transparent 70%);
    animation: breathe 9s var(--ease) infinite alternate; }
  @keyframes breathe { from { opacity: .65; transform: scale(.96); } to { opacity: 1; transform: scale(1.04); } }
  .floor { position: fixed; left: 0; right: 0; bottom: 0; height: 38vh; pointer-events: none; z-index: 0; opacity: .5;
    background: linear-gradient(to top, rgba(5,5,5,1), rgba(5,5,5,0) 70%),
                repeating-linear-gradient(90deg, var(--hair) 0 1px, transparent 1px 64px);
    transform: perspective(420px) rotateX(62deg); transform-origin: 50% 100%; }

  main { position: relative; z-index: 2; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 72px 20px 96px; text-align: center; }
  .top { position: fixed; z-index: 3; top: calc(22px + env(safe-area-inset-top, 0)); left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 11px;
    letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .top .live { display: inline-flex; align-items: center; gap: 9px; }
  .top .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 10px var(--blue); animation: pulse 2.4s var(--ease) infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* the mark: four capsules that drift apart and lock back, as if something inside is turning on */
  .mark { width: min(38vw, 190px); aspect-ratio: 1000/991.86; position: relative; margin-bottom: 44px; perspective: 900px; }
  .mark svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 22px rgba(31,56,255,.35)); transform: rotateX(8deg) rotateY(-10deg); animation: tilt 14s ease-in-out infinite alternate; }
  @keyframes tilt { to { transform: rotateX(-6deg) rotateY(10deg); } }
  .mark path { fill: var(--ink); transform-box: fill-box; transform-origin: center; animation: drift 7s var(--ease) infinite; }
  .mark path:nth-child(1) { --dx: -7px; --dy: -7px; }
  .mark path:nth-child(2) { --dx:  7px; --dy: -7px; animation-delay: .15s; }
  .mark path:nth-child(3) { --dx: -7px; --dy:  7px; animation-delay: .3s; }
  .mark path:nth-child(4) { --dx:  7px; --dy:  7px; animation-delay: .45s; }
  @keyframes drift { 0%, 62%, 100% { transform: translate(0,0); opacity: 1; } 74% { transform: translate(var(--dx), var(--dy)); opacity: .82; } 86% { transform: translate(0,0); opacity: 1; } }

  h1 { font-family: var(--disp); font-weight: 400; font-size: clamp(22px, 6vw, 34px); letter-spacing: .32em; margin-right: -.32em; }
  .word { height: 18px; margin-top: 16px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--blue-ink); }
  .lede { margin-top: 26px; font-size: 15px; line-height: 1.6; color: var(--dim); max-width: 30ch; }

  form { width: 100%; max-width: 380px; margin-top: 34px; display: flex; flex-direction: column; gap: 10px; }
  .field { position: relative; }
  input[type=email], input[type=text] { width: 100%; font: 15px/1.2 var(--sans); color: var(--ink); background: rgba(231,231,226,.04);
    border: 1px solid var(--faint); border-radius: 12px; padding: 16px 16px; outline: none; -webkit-appearance: none;
    transition: border-color .25s var(--ease), background .25s var(--ease); }
  input::placeholder { color: rgba(231,231,226,.38); }
  input:focus { border-color: rgba(125,141,255,.8); background: rgba(31,56,255,.06); }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 4px 0 2px; }
  .chips span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
    border: 1px solid var(--faint); border-radius: 999px; padding: 7px 11px; cursor: pointer; user-select: none;
    transition: color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease); }
  .chips span.on { color: #fff; border-color: var(--blue); background: rgba(31,56,255,.22); }
  .chips-label { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: rgba(231,231,226,.36); margin-top: 6px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  button[type=submit] { margin-top: 6px; font: 600 15px/1 var(--sans); letter-spacing: .02em; color: #fff; background: var(--blue);
    border: none; border-radius: 12px; padding: 17px; cursor: pointer; box-shadow: 0 10px 40px rgba(31,56,255,.35);
    transition: transform .25s var(--ease), box-shadow .25s var(--ease), opacity .25s; }
  button[type=submit]:hover { transform: translateY(-1px); box-shadow: 0 14px 50px rgba(31,56,255,.5); }
  button[type=submit]:disabled { opacity: .55; cursor: default; transform: none; }
  .msg { min-height: 18px; margin-top: 4px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .msg.bad { color: #ff7a8a; }
  .fine { margin-top: 18px; font-size: 12px; color: rgba(231,231,226,.36); }

  .done { display: none; margin-top: 34px; max-width: 380px; }
  .done .t { font-family: var(--disp); font-size: 15px; letter-spacing: .24em; text-transform: uppercase; }
  .done .d { margin-top: 14px; font-size: 15px; line-height: 1.6; color: var(--dim); }
  .done .share { margin-top: 24px; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink);
    background: none; border: 1px solid var(--faint); border-radius: 999px; padding: 11px 18px; cursor: pointer; }
  body.in form, body.in .lede { display: none; }
  body.in .done { display: block; animation: rise .7s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

  footer { position: relative; z-index: 3; margin-top: -70px; padding: 0 20px calc(26px + env(safe-area-inset-bottom, 0)); display: flex; justify-content: center; gap: 18px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: rgba(231,231,226,.34); }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: var(--ink); }

  /* entrance: the room assembles from depth, once */
  .rise { opacity: 0; animation: rise .9s var(--ease) forwards; }
  .rise:nth-child(2) { animation-delay: .12s; } .rise:nth-child(3) { animation-delay: .24s; } .rise:nth-child(4) { animation-delay: .36s; } .rise:nth-child(5) { animation-delay: .48s; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .rise { opacity: 1; } }
  @media (max-height: 640px) { .mark { width: 110px; margin-bottom: 26px; } main { padding-top: 56px; } }
</style>
</head>
<body>
<div class="glow"></div>
<div class="floor"></div>
<div class="top"><span class="live"><i></i>Online</span><span>0.9</span></div>

<main>
  <div class="mark rise" aria-hidden="true">
    <svg viewBox="0 0 1000 991.86" xmlns="http://www.w3.org/2000/svg">
      <path d="M11.27,176.80L83.75,335.66A124.94,124.94 0 0 0 311.09,231.94L238.61,73.08A124.94,124.94 0 0 0 11.27,176.80Z"/>
      <path d="M761.39,73.08L688.91,231.94A124.94,124.94 0 0 0 916.25,335.66L988.73,176.80A124.94,124.94 0 0 0 761.39,73.08Z"/>
      <path d="M83.75,656.20L11.27,815.06A124.94,124.94 0 0 0 238.61,918.77L311.09,759.91A124.94,124.94 0 0 0 83.75,656.20Z"/>
      <path d="M688.91,759.91L761.39,918.77A124.94,124.94 0 0 0 988.73,815.06L916.25,656.20A124.94,124.94 0 0 0 688.91,759.91Z"/>
    </svg>
  </div>
  <h1 class="rise">SYCSTEM</h1>
  <div class="word rise" id="word" aria-hidden="true">&nbsp;</div>
  <p class="lede rise">Something new for the edit.<br>Private beta — opening soon.</p>

  <form class="rise" id="f" novalidate>
    <div class="field"><input type="email" id="email" name="email" placeholder="Email" autocomplete="email" inputmode="email" required></div>
    <div class="field"><input type="text" id="handle" name="handle" placeholder="Instagram (optional)" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="chips-label">You edit in</div>
    <div class="chips" id="chips">
      <span data-v="premiere">Premiere</span><span data-v="aftereffects">After Effects</span><span data-v="capcut">CapCut</span><span data-v="resolve">Resolve</span><span data-v="other">Other</span>
    </div>
    <input class="hp" type="text" name="website" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" id="go">Request access</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="fine">One email when your access is ready. Nothing else.</div>
  </form>

  <div class="done" id="done">
    <div class="t">You're on the list</div>
    <p class="d" id="doneD">Invites go out by email. Keep an eye on your inbox.</p>
    <button class="share" id="share" type="button">Copy the link</button>
  </div>
</main>

<footer><a href="https://www.instagram.com/gualohawes/" target="_blank" rel="noopener">@gualohawes</a><a href="https://gualohawes.vercel.app/">gualohawes</a></footer>

<script>
(function () {
  var API = 'https://vault-y6mf.vercel.app/api/beta/signup';
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search), source = (q.get('ref') || q.get('utm_source') || (/instagram/i.test(navigator.userAgent) ? 'ig' : '') || 'direct').slice(0, 40);
  var editor = '';

  // the world words of the units, one at a time — what it is, never said outright
  var WORDS = ['Motion', 'Surface', 'Emulsion', 'Magnetic', 'Colour', 'Timebase', 'Matte', 'Velocity', 'Signal'], wi = 0, GL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ·';
  function decode(el, target) {
    var n = 0, steps = 14;
    (function tick() {
      var out = ''; for (var i = 0; i < target.length; i++) out += i < n * target.length / steps ? target[i] : GL[Math.floor(Math.random() * GL.length)];
      el.textContent = out; if (n++ < steps) setTimeout(tick, 38); else el.textContent = target;
    })();
  }
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function next() { decode($('word'), WORDS[wi++ % WORDS.length]); }
  setTimeout(next, 900); if (!calm) setInterval(next, 2600);

  $('chips').addEventListener('click', function (e) {
    var c = e.target.closest('span'); if (!c) return;
    var on = !c.classList.contains('on');
    Array.prototype.forEach.call(this.children, function (x) { x.classList.remove('on'); });
    if (on) c.classList.add('on'); editor = on ? c.dataset.v : '';
  });

  try { var saved = localStorage.getItem('syc_beta_email'); if (saved) { document.body.classList.add('in'); $('doneD').textContent = saved + ' is on the list. Invites go out by email.'; } } catch (e) {}

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = $('email').value.trim(), msg = $('msg');
    msg.className = 'msg';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { msg.textContent = 'That email doesn’t look right'; msg.className = 'msg bad'; $('email').focus(); return; }
    $('go').disabled = true; msg.textContent = 'Sending…';
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, handle: $('handle').value, editor: editor, source: source, website: $('website').value }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j.ok) throw new Error(res.j && res.j.error || 'Something went wrong');
        try { localStorage.setItem('syc_beta_email', email); } catch (x) {}
        $('doneD').textContent = res.j.already ? 'You were already on the list — you’re set. Invites go out by email.' : 'Invites go out by email. Keep an eye on your inbox.';
        document.body.classList.add('in');
      })
      .catch(function (err) { msg.textContent = String(err.message || err).slice(0, 80) || 'Try again'; msg.className = 'msg bad'; $('go').disabled = false; });
  });

  $('share').addEventListener('click', function () {
    var url = 'https://sycstem.vercel.app/', b = this;
    function ok() { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy the link'; }, 1600); }
    if (navigator.share) { navigator.share({ title: 'SYCSTEM', url: url }).catch(function () {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(ok, function () { prompt('Copy:', url); }); else prompt('Copy:', url);
  });
})();
</script>
</body>
</html>
