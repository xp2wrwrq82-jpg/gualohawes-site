<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYCSTEM</title>
<meta name="description" content="private beta soon. by invitation.">
<meta name="theme-color" content="#ebebea">
<meta property="og:type" content="website">
<meta property="og:title" content="SYCSTEM">
<meta property="og:description" content="private beta soon. by invitation.">
<meta property="og:url" content="https://gualo.site/sycstem/">
<meta property="og:image" content="https://gualo.site/sycstem/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SYCSTEM">
<meta name="twitter:description" content="private beta soon. by invitation.">
<meta name="twitter:image" content="https://gualo.site/sycstem/og.png">
<link rel="icon" href="/sycstem/mark.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #1d1d1f; --grey: #6e6e73; --soft: #a1a1a6;
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.22,.61,.36,1);
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { background: #f5f5f6; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  ::selection { background: #1d1d1f; color: #fff; }

  /* one frame of footage behind the glass per visit (the next visit shows the next one): still, softly out of focus, washed in white */
  .reel { position: fixed; inset: -6%; z-index: 0; pointer-events: none; }
  .reel img, .reel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; filter: blur(5px) saturate(.9); transition: opacity 1.6s var(--ease); }
  .reel img.on, .reel video.on { opacity: 1; }
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 46%, rgba(255,255,255,.86) 0%, rgba(255,255,255,.82) 55%, rgba(250,250,251,.85) 100%); }

  main { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; text-align: center; }
  @supports (height: 100dvh) { main { height: 100dvh; } }
  main { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  /* phones: the footage and the veil cover the LARGEST screen (behind Safari's toolbars as they slide away), the words stay
     centred in what's actually visible, nothing rubber-bands, and in landscape the text keeps clear of the notch */
  html { background: #ebebea; overscroll-behavior: none; }
  @supports (height: 100lvh) {
    .reel { inset: auto; top: -6lvh; left: -6vw; width: 112vw; height: 112lvh; }
    .veil { inset: auto; top: 0; left: 0; width: 100vw; height: 100lvh; }
  }

  .stage { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; }
  .mark { width: 14px; height: 14px; color: var(--soft); opacity: 0; animation: appear 1.4s var(--ease) .5s forwards; }
  /* one line, lowercase, surfacing letter by letter out of the blur */
  .line { margin-top: 28px; font-size: 14px; letter-spacing: .06em; color: #4a4a4f; white-space: nowrap; }
  .line span { display: inline-block; opacity: 0; filter: blur(6px); animation: letter 1.4s var(--ease) forwards; }
  .line span.sp { width: .32em; }
  @keyframes letter { to { opacity: 1; filter: none; } }

  form { width: 100%; margin-top: 32px; opacity: 0; animation: appear 1.6s var(--ease) 2.6s forwards; }
  .field-in { position: relative; display: flex; align-items: center; height: 52px; border-radius: 999px;
    background: rgba(255,255,255,.82); backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10), 0 10px 30px rgba(30,30,40,.06); transition: box-shadow .3s var(--ease); }
  .field-in:focus-within { box-shadow: inset 0 0 0 .5px rgba(0,0,0,.24), 0 12px 36px rgba(30,30,40,.09); }
  .field-in input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; padding: 0 0 0 22px;
    font: 400 16px var(--sans); letter-spacing: -.01em; color: var(--ink); }
  .field-in input::placeholder { color: var(--soft); }
  .arrow { flex: 0 0 auto; width: 36px; height: 36px; margin-right: 8px; border: 0; border-radius: 50%; cursor: pointer;
    background: transparent; color: var(--grey); display: grid; place-items: center; transition: color .25s var(--ease), background .25s var(--ease), opacity .25s; }
  .arrow svg { width: 15px; height: 15px; }
  .field-in:focus-within .arrow, .arrow:hover { color: var(--ink); background: rgba(0,0,0,.04); }
  .arrow:disabled { opacity: .4; cursor: default; }
  .note { margin-top: 14px; min-height: 15px; font-size: 12px; color: var(--grey); }
  .note.bad { color: #b3261e; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  .after { display: none; flex-direction: column; align-items: center; margin-top: 30px; }
  .after .t { font-size: 14px; letter-spacing: .06em; color: #4a4a4f; }
  .after .n { margin-top: 6px; font-size: 12px; color: var(--grey); font-variant-numeric: tabular-nums; letter-spacing: .04em; min-height: 14px; }
  .after .ig { margin-top: 26px; width: 100%; }
  .after .ig.sent { display: none; }
  body.in form, body.in .note, body.closed form, body.closed .note { display: none; }
  body.in .after { display: flex; animation: appear 1.2s var(--ease) forwards; }

  .fine { position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0)); text-align: center;
    font-size: 11px; letter-spacing: .04em; color: #8e8e93; opacity: 0; animation: appear 1.6s var(--ease) 3.4s forwards; }
  @keyframes appear { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .mark, form, .line span, .fine { opacity: 1; filter: none; } .reel img { transition: none; filter: blur(8px); } }
</style>
</head>
<body>
<div class="reel" id="reel" aria-hidden="true"><img id="frame" alt=""><video id="vid" muted loop playsinline autoplay preload="auto" disablepictureinpicture></video></div>
<div class="veil"></div>

<main>
  <div class="stage">
    <svg class="mark" viewBox="0 0 1000 991.86" fill="currentColor" role="img" aria-label="SYCSTEM"><path d="M11.27,176.80L83.75,335.66A124.94,124.94 0 0 0 311.09,231.94L238.61,73.08A124.94,124.94 0 0 0 11.27,176.80Z"/><path d="M761.39,73.08L688.91,231.94A124.94,124.94 0 0 0 916.25,335.66L988.73,176.80A124.94,124.94 0 0 0 761.39,73.08Z"/><path d="M83.75,656.20L11.27,815.06A124.94,124.94 0 0 0 238.61,918.77L311.09,759.91A124.94,124.94 0 0 0 83.75,656.20Z"/><path d="M688.91,759.91L761.39,918.77A124.94,124.94 0 0 0 988.73,815.06L916.25,656.20A124.94,124.94 0 0 0 688.91,759.91Z"/></svg>
    <p class="line" id="line" aria-label="private beta soon. by invitation.">private beta soon. by invitation.</p>

    <form id="f" novalidate>
      <div class="field-in">
        <input type="email" id="email" placeholder="email for an invitation" autocomplete="email" inputmode="email" aria-label="email for an invitation" required>
        <button class="arrow" id="go" type="submit" aria-label="Request access"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8h9.5M8.6 3.9 12.7 8l-4.1 4.1"/></svg></button>
      </div>
      <input class="hp" type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    </form>
    <p class="note" id="note" role="status" aria-live="polite"></p>

    <div class="after" id="after">
      <div class="t" id="t">you're on the list.</div>
      <div class="n" id="n"></div>
      <div class="ig" id="ig">
        <div class="field-in">
          <input type="text" id="handle" placeholder="Instagram, optional" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Instagram">
          <button class="arrow" id="save" type="button" aria-label="Save"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8h9.5M8.6 3.9 12.7 8l-4.1 4.1"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</main>
<p class="fine">Technology by Gualo Hawes</p>

<script>
(function () {
  var API = 'https://vault-y6mf.vercel.app/api/beta/signup';
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search), source = (q.get('ref') || q.get('utm_source') || (/instagram/i.test(navigator.userAgent) ? 'ig' : '') || 'direct').slice(0, 40);
  var email = '';
  /* gualo.site/admin can change the line, the fine print, which loops play and whether the list is open.
     The last copy this browser saw applies at once; a fresh one is fetched and lands before the line starts. */
  var SITE = 'https://vault-y6mf.vercel.app/api/site', t0 = Date.now(), CFG = null;
  try { CFG = JSON.parse(localStorage.getItem('syc_cfg') || 'null'); } catch (e) {}

  /* the frame for this visit: the same one for the whole session, the next one on the next visit */
  // each frame lifted to the same whiteness: the night forest is dark, the glitch is already bright
  var ALL = [{ src: '/sycstem/bg/forest.webp', mp4: '/sycstem/bg/forest.mp4', f: 'blur(5px) saturate(.85) contrast(.45) brightness(1.75)', bg: '#ececea' }, { src: '/sycstem/bg/glitch.webp', mp4: '/sycstem/bg/glitch.mp4', f: 'blur(5px) saturate(.85) contrast(.55) brightness(1.5)', bg: '#e9eaea' }], FRAMES = ALL, pick = 0;
  var loopName = function (f) { return f.mp4.split('/').pop().replace(/\.mp4$/, ''); };
  if (CFG && CFG.loops) { var onLoops = ALL.filter(function (f) { return CFG.loops.indexOf(loopName(f)) >= 0; }); if (onLoops.length) FRAMES = onLoops; }
  try {
    var ss = sessionStorage.getItem('syc_frame');
    if (ss !== null) pick = +ss % FRAMES.length;
    else { var last = localStorage.getItem('syc_frame_last'); pick = last === null ? Math.floor(Math.random() * FRAMES.length) : (+last + 1) % FRAMES.length; localStorage.setItem('syc_frame_last', pick); sessionStorage.setItem('syc_frame', pick); }
  } catch (e) { pick = Math.floor(Math.random() * FRAMES.length); }
  pick = pick % FRAMES.length;
  // the loop plays as a silent video (every phone, Instagram's browser); the animated image stays underneath if a phone won't autoplay
  var F = FRAMES[pick], img = $('frame'), vid = $('vid');
  function edgeColour(f) {
    var c = f.bg || '#ebebea', m = document.querySelector('meta[name="theme-color"]');
    document.documentElement.style.backgroundColor = c; document.body.style.backgroundColor = c; if (m) m.setAttribute('content', c);
  }
  edgeColour(F);
  img.style.filter = vid.style.filter = F.f;
  img.onload = function () { img.classList.add('on'); }; img.src = F.src;
  vid.src = F.mp4; vid.muted = true;
  vid.addEventListener('playing', function () { vid.classList.add('on'); setTimeout(function () { img.classList.remove('on'); }, 1700); });
  var tryPlay = function () { var pr = vid.play(); if (pr && pr.catch) pr.catch(function () {}); };
  tryPlay(); document.addEventListener('visibilitychange', function () { if (!document.hidden) tryPlay(); });
  document.addEventListener('touchstart', tryPlay, { once: true, passive: true });

  /* the line, letter by letter (after the mark has settled) */
  function buildLine(txt) {
    var el = $('line'), html = '', d = Math.max(0, 1.1 - (Date.now() - t0) / 1000);
    el.setAttribute('aria-label', txt);
    for (var i = 0; i < txt.length; i++) { var ch = txt[i]; html += ch === ' ' ? '<span class="sp" aria-hidden="true" style="animation-delay:' + d.toFixed(2) + 's">&nbsp;</span>' : '<span aria-hidden="true" style="animation-delay:' + d.toFixed(2) + 's">' + ch.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }) + '</span>'; d += ch === '.' ? 0.32 : 0.045; }
    el.innerHTML = html;
  }
  var lineNow = $('line').textContent;
  function applyCfg(c) {
    if (!c) return;
    if (typeof c.fine === 'string') document.querySelector('.fine').textContent = c.fine;
    if (c.ask) { $('email').placeholder = c.ask; $('email').setAttribute('aria-label', c.ask); }
    document.body.classList.toggle('closed', c.signups === 'paused');
  }
  if (CFG && CFG.line) lineNow = CFG.line;
  buildLine(lineNow); applyCfg(CFG);
  fetch(SITE + '/config', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    var c = j && j.teaser; if (!c) return;
    try { localStorage.setItem('syc_cfg', JSON.stringify(c)); } catch (e) {}
    if (c.line && c.line !== lineNow && Date.now() - t0 < 1000) { lineNow = c.line; buildLine(lineNow); }
    if (c.loops && c.loops.indexOf(loopName(F)) < 0 && Date.now() - t0 < 1500) {
      var allowed = ALL.filter(function (f) { return c.loops.indexOf(loopName(f)) >= 0; });
      if (allowed.length) { F = allowed[pick % allowed.length]; edgeColour(F); img.style.filter = vid.style.filter = F.f; img.src = F.src; vid.src = F.mp4; vid.muted = true; tryPlay(); }
    }
    applyCfg(c);
  }).catch(function () {});
  function readyState(input) { var w = input.closest('.field-in'); w.classList.toggle('ready', input.value.trim().length > 2); }
  $('email').addEventListener('input', function () { readyState(this); });
  $('handle').addEventListener('input', function () { readyState(this); });

  function post(body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j && j.error || 'Something went wrong.'); return j; }); });
  }
  function placeText(n) { return n ? 'no. ' + String(n).padStart(3, '0') : ''; }
  try { var saved = JSON.parse(localStorage.getItem('syc_beta') || 'null'); if (saved && saved.email) { email = saved.email; $('n').textContent = placeText(saved.n); $('ig').classList.add('sent'); document.body.classList.add('in'); } } catch (e) {}

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('email').value.trim(), note = $('note');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { note.textContent = 'That email doesn’t look right.'; note.className = 'note bad'; $('email').focus(); return; }
    $('go').disabled = true; note.className = 'note'; note.textContent = '';
    post({ email: v, source: source, website: $('website').value }).then(function (j) {
      email = v; $('n').textContent = placeText(j.n);
      if (j.already) { $('t').textContent = 'You’re already on the list.'; $('ig').classList.add('sent'); }
      try { localStorage.setItem('syc_beta', JSON.stringify({ email: v, n: j.n || 0 })); } catch (x) {}
      document.body.classList.add('in');
    }).catch(function (err) { note.textContent = String(err.message || err).slice(0, 80); note.className = 'note bad'; $('go').disabled = false; });
  });
  function saveHandle() {
    var h = $('handle').value.trim(); if (!h) return;
    $('save').disabled = true;
    post({ email: email, handle: h, source: source }).then(function () { $('ig').classList.add('sent'); }, function () { $('save').disabled = false; });
  }
  $('save').addEventListener('click', saveHandle);
  $('handle').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); saveHandle(); } });

  try {
    var first = !sessionStorage.getItem('syc_seen'); sessionStorage.setItem('syc_seen', '1');
    var ref = ''; try { ref = document.referrer ? new URL(document.referrer).host : ''; } catch (e) {}
    var hit = JSON.stringify({ page: 'beta', src: source === 'direct' ? '' : source, ref: ref, first: first });
    if (navigator.sendBeacon) navigator.sendBeacon(SITE + '/hit', new Blob([hit], { type: 'text/plain' }));
  } catch (e) {}
})();
</script>
</body>
</html>
