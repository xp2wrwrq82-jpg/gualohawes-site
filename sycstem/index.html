<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYCSTEM</title>
<meta name="description" content="By invitation.">
<meta name="theme-color" content="#f4f4f5">
<meta property="og:type" content="website">
<meta property="og:title" content="SYCSTEM">
<meta property="og:description" content="By invitation.">
<meta property="og:url" content="https://gualo.site/sycstem/">
<meta property="og:image" content="https://gualo.site/sycstem/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SYCSTEM">
<meta name="twitter:description" content="By invitation.">
<meta name="twitter:image" content="https://gualo.site/sycstem/og.png">
<link rel="icon" href="/sycstem/mark.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #1d1d1f; --grey: #86868b; --soft: #aeaeb2;
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.22,.61,.36,1);
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #f4f4f5; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  ::selection { background: #1d1d1f; color: #fff; }

  /* a white room, lit from above */
  .room { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(130% 95% at 50% 30%, #ffffff 0%, #f7f7f8 42%, #ececee 100%); }

  /* white spheres floating through depth + fine dust in the light. each sphere is a sharp copy and a soft copy;
     the camera pulls focus slowly through the room, so they drift in and out of focus */
  .field { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .cap { position: absolute; left: 0; top: 0; will-change: transform; }
  .cap i { position: absolute; inset: 0; border-radius: 50%; will-change: opacity;
    background: radial-gradient(circle at 34% 28%, #ffffff 0%, #fbfbfc 28%, #ededf0 62%, #dcdce1 100%);
    box-shadow: inset -6px -10px 22px rgba(110,110,120,.14), 0 26px 48px rgba(30,30,40,.09), 0 6px 14px rgba(30,30,40,.04); }
  .cap.glass i { background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.95) 0%, rgba(250,250,252,.6) 35%, rgba(230,230,235,.32) 100%);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.9), inset -4px -8px 18px rgba(110,110,120,.10), 0 18px 34px rgba(30,30,40,.05); }
  .dust { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  main { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 22px; }
  .stage { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; }
  .mark { width: 15px; height: 15px; color: var(--soft); opacity: 0; animation: appear 1.6s var(--ease) 1.2s forwards; }

  form { width: 100%; margin-top: 30px; opacity: 0; animation: appear 1.6s var(--ease) 2s forwards; }
  .field-in { position: relative; display: flex; align-items: center; height: 52px; border-radius: 999px;
    background: rgba(255,255,255,.78); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10), 0 10px 30px rgba(30,30,40,.06); transition: box-shadow .3s var(--ease); }
  .field-in:focus-within { box-shadow: inset 0 0 0 .5px rgba(0,0,0,.22), 0 12px 36px rgba(30,30,40,.09); }
  .field-in input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; padding: 0 0 0 22px;
    font: 400 16px var(--sans); letter-spacing: -.01em; color: var(--ink); }
  .field-in input::placeholder { color: var(--soft); }
  .arrow { flex: 0 0 auto; width: 36px; height: 36px; margin-right: 8px; border: 0; border-radius: 50%; cursor: pointer;
    background: transparent; color: var(--grey); display: grid; place-items: center; transition: color .25s var(--ease), background .25s var(--ease), opacity .25s; }
  .arrow svg { width: 15px; height: 15px; }
  .field-in:focus-within .arrow, .arrow:hover { color: var(--ink); background: rgba(0,0,0,.04); }
  .arrow:disabled { opacity: .4; cursor: default; }
  .note { margin-top: 16px; text-align: center; font-size: 12px; letter-spacing: .01em; color: var(--grey); opacity: 0; animation: appear 1.6s var(--ease) 2.6s forwards; min-height: 15px; }
  .note.bad { color: #b3261e; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  /* after: quiet confirmation, a place in line, one optional field */
  .after { display: none; flex-direction: column; align-items: center; text-align: center; }
  .after .t { font-size: 15px; letter-spacing: -.01em; color: var(--ink); }
  .after .n { margin-top: 8px; font-size: 12px; color: var(--grey); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .after .ig { margin-top: 26px; width: 100%; }
  .after .ig .field-in input { text-align: left; }
  .after .later { margin-top: 14px; font-size: 12px; color: var(--grey); background: none; border: 0; cursor: pointer; }
  .after .later:hover { color: var(--ink); }
  .after .ig.sent { display: none; }
  body.in form, body.in .note { display: none; }
  body.in .after { display: flex; animation: appear 1.2s var(--ease) forwards; }

  @keyframes appear { from { opacity: 0; filter: blur(10px); } to { opacity: 1; filter: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .mark, form, .note { opacity: 1; } }
</style>
</head>
<body>
<div class="room"></div>
<canvas class="dust" id="dust" aria-hidden="true"></canvas>
<div class="field" id="field" aria-hidden="true"></div>

<main>
  <div class="stage">
    <svg class="mark" viewBox="0 0 1000 991.86" fill="currentColor" role="img" aria-label="SYCSTEM"><path d="M11.27,176.80L83.75,335.66A124.94,124.94 0 0 0 311.09,231.94L238.61,73.08A124.94,124.94 0 0 0 11.27,176.80Z"/><path d="M761.39,73.08L688.91,231.94A124.94,124.94 0 0 0 916.25,335.66L988.73,176.80A124.94,124.94 0 0 0 761.39,73.08Z"/><path d="M83.75,656.20L11.27,815.06A124.94,124.94 0 0 0 238.61,918.77L311.09,759.91A124.94,124.94 0 0 0 83.75,656.20Z"/><path d="M688.91,759.91L761.39,918.77A124.94,124.94 0 0 0 988.73,815.06L916.25,656.20A124.94,124.94 0 0 0 688.91,759.91Z"/></svg>

    <form id="f" novalidate>
      <div class="field-in">
        <input type="email" id="email" placeholder="Email" autocomplete="email" inputmode="email" aria-label="Email" required>
        <button class="arrow" id="go" type="submit" aria-label="Request access"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8h9.5M8.6 3.9 12.7 8l-4.1 4.1"/></svg></button>
      </div>
      <input class="hp" type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    </form>
    <p class="note" id="note" role="status" aria-live="polite">By invitation.</p>

    <div class="after" id="after">
      <div class="t" id="t">You're on the list.</div>
      <div class="n" id="n"></div>
      <div class="ig" id="ig">
        <div class="field-in">
          <input type="text" id="handle" placeholder="Instagram, optional" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Instagram">
          <button class="arrow" id="save" type="button" aria-label="Save"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8h9.5M8.6 3.9 12.7 8l-4.1 4.1"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
(function () {
  var API = 'https://vault-y6mf.vercel.app/api/beta/signup';
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search), source = (q.get('ref') || q.get('utm_source') || (/instagram/i.test(navigator.userAgent) ? 'ig' : '') || 'direct').slice(0, 40);
  var email = '';

  /* ── the room ── */
  var field = $('field'), caps = [], W = innerWidth, H = innerHeight, small = W < 640, calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var N = small ? 11 : 16, a32 = 0x51C57E;
  function rnd() { a32 = (a32 + 0x6D2B79F5) | 0; var t = Math.imul(a32 ^ (a32 >>> 15), 1 | a32); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  var K = Math.max(0.6, Math.min(1.15, Math.min(W, H) / 820));
  for (var i = 0; i < N; i++) {
    var z = Math.pow(rnd(), 0.85), size = ((small ? 18 : 22) + z * (small ? 120 : 190)) * K, el = document.createElement('div');
    el.className = 'cap' + (rnd() > 0.7 ? ' glass' : '');
    el.style.width = el.style.height = Math.round(size) + 'px'; el.style.zIndex = Math.round(z * 100);
    var sharp = document.createElement('i'), soft = document.createElement('i');
    soft.style.filter = 'blur(' + ((6 + z * 16) * K).toFixed(1) + 'px)';     // how soft it gets out of focus (near ones melt more)
    el.appendChild(soft); el.appendChild(sharp);
    caps.push({ el: el, s: sharp, b: soft, z: z, ang: (i / N) * Math.PI * 2 + (rnd() - 0.5) * 0.5, out: rnd(), rot: (rnd() < 0.5 ? -1 : 1) * 24.5 + (rnd() - 0.5) * 30,
                sp: 0.03 + rnd() * 0.05, ph: rnd() * 6.28, amp: (8 + z * 18) * K, size: size, fade: 0.6 + 0.4 * Math.min(1, z * 1.6) });
    field.appendChild(el);
  }
  function place(c) {   // outside the words, bigger ones further out
    var st = document.querySelector('.stage').getBoundingClientRect(), cx = st.left + st.width / 2, cy = st.top + st.height / 2;
    var hw = Math.min(W * 0.46, st.width / 2 + 30), hh = Math.max(60, st.height / 2 + 40), gap = c.size * (0.3 + c.z * 0.25);
    c.px = cx + Math.cos(c.ang) * (hw + gap + c.out * Math.max(40, (W / 2 - hw) * 0.9));
    c.py = cy + Math.sin(c.ang) * (hh + gap + c.out * Math.max(40, (H / 2 - hh) * 0.9));
  }
  function layout() { W = innerWidth; H = innerHeight; caps.forEach(place); }
  layout(); setTimeout(layout, 500); addEventListener('resize', layout);

  var px = 0, py = 0, tx = 0, ty = 0, T0 = performance.now();
  addEventListener('pointermove', function (e) { tx = e.clientX / W - 0.5; ty = e.clientY / H - 0.5; }, { passive: true });
  function frame(now) {
    var t = (now - T0) / 1000;
    px += (tx - px) * 0.035; py += (ty - py) * 0.035;
    // the focus pull: the room opens fully soft, then the focal plane drifts slowly from far to near and back
    var focus = 0.45 + 0.32 * Math.sin(t * 2 * Math.PI / 18 - 1.2), intro = Math.min(1, Math.max(0, (t - 0.4) / 2.6));
    intro = intro * intro * (3 - 2 * intro);
    for (var k = 0; k < caps.length; k++) {
      var c = caps[k], par = (c.z - focus) * 60;
      var dx = Math.sin(t * c.sp + c.ph) * c.amp - px * par, dy = Math.cos(t * c.sp * 0.8 + c.ph) * c.amp * 0.8 - py * par;
      c.el.style.transform = 'translate3d(' + (c.px - c.size * 0.5 + dx).toFixed(1) + 'px,' + (c.py - c.size * 0.5 + dy).toFixed(1) + 'px,0)';
      var d = Math.min(1, Math.abs(c.z - focus) / 0.3), sharpness = (1 - d) * intro;
      c.s.style.opacity = (sharpness * c.fade).toFixed(3); c.b.style.opacity = ((1 - sharpness * 0.85) * c.fade).toFixed(3);
    }
    dust(t, focus, intro);
    if (!calm) requestAnimationFrame(frame);
  }
  var cv = $('dust'), cx2 = cv.getContext('2d'), DPR = Math.min(2, devicePixelRatio || 1), motes = [];
  function sizeDust() { cv.width = Math.round(innerWidth * DPR); cv.height = Math.round(innerHeight * DPR); cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; }
  sizeDust(); addEventListener('resize', sizeDust);
  for (var m = 0; m < (small ? 60 : 110); m++) motes.push({ x: rnd(), y: rnd(), z: rnd(), s: 0.6 + rnd() * 1.8, v: 0.004 + rnd() * 0.012, w: rnd() * 6.28 });
  function dust(t, focus, intro) {
    var w = cv.width, h = cv.height; cx2.clearRect(0, 0, w, h);
    for (var j = 0; j < motes.length; j++) {
      var o = motes[j], y = ((o.y - t * o.v) % 1 + 1) % 1, x = o.x + Math.sin(t * 0.2 + o.w) * 0.01;
      var d = Math.abs(o.z - focus), rad = (o.s + d * 9 * (0.4 + o.z)) * DPR * K, a = (0.10 + 0.35 * (1 - Math.min(1, d / 0.35))) * intro * (0.35 + o.z * 0.65);
      var X = (x - px * (o.z - focus) * 0.05) * w, Y = (y - py * (o.z - focus) * 0.05) * h;
      var g = cx2.createRadialGradient(X, Y, 0, X, Y, rad);
      g.addColorStop(0, 'rgba(255,255,255,' + Math.min(1, a * 2.2).toFixed(3) + ')'); g.addColorStop(0.45, 'rgba(250,250,252,' + a.toFixed(3) + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
      cx2.fillStyle = g; cx2.beginPath(); cx2.arc(X, Y, rad, 0, 6.2832); cx2.fill();
      if (d < 0.08) { cx2.fillStyle = 'rgba(180,180,190,' + (0.18 * intro).toFixed(3) + ')'; cx2.beginPath(); cx2.arc(X, Y, Math.max(0.6 * DPR, rad * 0.22), 0, 6.2832); cx2.fill(); }   // in focus: a crisp speck
    }
  }
  requestAnimationFrame(frame);

  /* ── the list ── */
  function post(body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j && j.error || 'Something went wrong.'); return j; }); });
  }
  function place2(n) { return n ? 'No. ' + String(n).padStart(3, '0') : ''; }
  try { var saved = JSON.parse(localStorage.getItem('syc_beta') || 'null'); if (saved && saved.email) { email = saved.email; $('n').textContent = place2(saved.n); $('ig').classList.add('sent'); document.body.classList.add('in'); } } catch (e) {}

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('email').value.trim(), note = $('note');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { note.textContent = 'That email doesn’t look right.'; note.className = 'note bad'; $('email').focus(); return; }
    $('go').disabled = true; note.className = 'note';
    post({ email: v, source: source, website: $('website').value }).then(function (j) {
      email = v; $('n').textContent = place2(j.n);
      if (j.already) { $('t').textContent = 'You’re already on the list.'; $('ig').classList.add('sent'); }
      try { localStorage.setItem('syc_beta', JSON.stringify({ email: v, n: j.n || 0 })); } catch (x) {}
      document.body.classList.add('in');
    }).catch(function (err) { note.textContent = String(err.message || err).slice(0, 80); note.className = 'note bad'; $('go').disabled = false; });
  });
  function saveHandle() {
    var h = $('handle').value.trim(); if (!h) return;
    $('save').disabled = true;
    post({ email: email, handle: h, source: source }).then(function () { $('ig').classList.add('sent'); }, function () { $('save').disabled = false; });
  }
  $('save').addEventListener('click', saveHandle);
  $('handle').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); saveHandle(); } });
})();
</script>
</body>
</html>
