<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gualo Hawes</title>
<meta name="description" content="soon.">
<meta name="theme-color" content="#ebebea">
<meta property="og:type" content="website">
<meta property="og:title" content="Gualo Hawes">
<meta property="og:description" content="soon.">
<meta property="og:url" content="https://gualo.site/">
<meta property="og:image" content="https://gualo.site/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Gualo Hawes">
<meta name="twitter:image" content="https://gualo.site/og.png">
<script>
/* the homepage is "soon" until gualo.site/admin opens it: then this sends visitors straight to the work */
(function () { try { var h = JSON.parse(localStorage.getItem('gh_home') || 'null'); if (h && h.mode === 'open') location.replace('/work/' + location.search); } catch (e) {} })();
</script>
<style>
  :root {
    --ink: #1d1d1f; --grey: #6e6e73; --soft: #a1a1a6;
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.22,.61,.36,1);
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { background: #f5f5f6; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  ::selection { background: #1d1d1f; color: #fff; }

  /* one frame of footage behind the glass per visit (the next visit shows the next one): still, softly out of focus, washed in white */
  .reel { position: fixed; inset: -6%; z-index: 0; pointer-events: none; }
  .reel img, .reel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; filter: blur(5px) saturate(.9); transition: opacity 1.6s var(--ease); }
  .reel img.on, .reel video.on { opacity: 1; }
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 46%, rgba(255,255,255,.86) 0%, rgba(255,255,255,.82) 55%, rgba(250,250,251,.85) 100%); }

  main { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; text-align: center; }
  @supports (height: 100dvh) { main { height: 100dvh; } }
  main { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  /* phones: the footage and the veil cover the LARGEST screen (behind Safari's toolbars as they slide away), the words stay
     centred in what's actually visible, nothing rubber-bands, and in landscape the text keeps clear of the notch */
  html { background: #ebebea; overscroll-behavior: none; }
  @supports (height: 100lvh) {
    .reel { inset: auto; top: -6lvh; left: -6vw; width: 112vw; height: 112lvh; }
    .veil { inset: auto; top: 0; left: 0; width: 100vw; height: 100lvh; }
  }

  .stage { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; }
  .mark { width: 14px; height: 14px; color: var(--soft); opacity: 0; animation: appear 1.4s var(--ease) .5s forwards; }
  /* one line, lowercase, surfacing letter by letter out of the blur */
  .line { margin-top: 28px; font-size: 14px; letter-spacing: .06em; color: #4a4a4f; white-space: nowrap; }
  .line span { display: inline-block; opacity: 0; filter: blur(6px); animation: letter 1.4s var(--ease) forwards; }
  .line span.sp { width: .32em; }
  @keyframes letter { to { opacity: 1; filter: none; } }

  form { width: 100%; margin-top: 32px; opacity: 0; animation: appear 1.6s var(--ease) 2.6s forwards; }
  .field-in { position: relative; display: flex; align-items: center; height: 52px; border-radius: 999px;
    background: rgba(255,255,255,.82); backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10), 0 10px 30px rgba(30,30,40,.06); transition: box-shadow .3s var(--ease); }
  .field-in:focus-within { box-shadow: inset 0 0 0 .5px rgba(0,0,0,.24), 0 12px 36px rgba(30,30,40,.09); }
  .field-in input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; padding: 0 0 0 22px;
    font: 400 16px var(--sans); letter-spacing: -.01em; color: var(--ink); }
  .field-in input::placeholder { color: var(--soft); }
  .arrow { flex: 0 0 auto; width: 36px; height: 36px; margin-right: 8px; border: 0; border-radius: 50%; cursor: pointer;
    background: transparent; color: var(--grey); display: grid; place-items: center; transition: color .25s var(--ease), background .25s var(--ease), opacity .25s; }
  .arrow svg { width: 15px; height: 15px; }
  .field-in:focus-within .arrow, .arrow:hover { color: var(--ink); background: rgba(0,0,0,.04); }
  .arrow:disabled { opacity: .4; cursor: default; }
  .note { margin-top: 14px; min-height: 15px; font-size: 12px; color: var(--grey); }
  .note.bad { color: #b3261e; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  .after { display: none; flex-direction: column; align-items: center; margin-top: 30px; }
  .after .t { font-size: 14px; letter-spacing: .06em; color: #4a4a4f; }
  .after .n { margin-top: 6px; font-size: 12px; color: var(--grey); font-variant-numeric: tabular-nums; letter-spacing: .04em; min-height: 14px; }
  .after .ig { margin-top: 26px; width: 100%; }
  .after .ig.sent { display: none; }
  body.in form, body.in .note, body.closed form, body.closed .note { display: none; }
  body.in .after { display: flex; animation: appear 1.2s var(--ease) forwards; }

  .fine { position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0)); text-align: center;
    font-size: 11px; letter-spacing: .04em; color: #8e8e93; opacity: 0; animation: appear 1.6s var(--ease) 3.4s forwards; }
  /* phones/tablets: the footage melts into Safari's strips (behind the clock, behind the address bar), which take the same colour */
  :root { --edge-rgb: 235, 235, 234; }
  .edge { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .edge { display: block; position: fixed; z-index: 1; left: 0; right: 0; pointer-events: none; }
    .edge.t { top: 0; height: 84px; background: linear-gradient(to bottom, rgba(var(--edge-rgb), 1) 0%, rgba(var(--edge-rgb), .94) 12%, rgba(var(--edge-rgb), .78) 28%,
      rgba(var(--edge-rgb), .55) 46%, rgba(var(--edge-rgb), .3) 64%, rgba(var(--edge-rgb), .12) 82%, rgba(var(--edge-rgb), 0) 100%); }
    .edge.b { bottom: 0; height: 110px; background: linear-gradient(to top, rgba(var(--edge-rgb), 1) 0%, rgba(var(--edge-rgb), .94) 12%, rgba(var(--edge-rgb), .78) 28%,
      rgba(var(--edge-rgb), .55) 46%, rgba(var(--edge-rgb), .3) 64%, rgba(var(--edge-rgb), .12) 82%, rgba(var(--edge-rgb), 0) 100%); }
  }
  @keyframes appear { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .mark, form, .line span, .fine { opacity: 1; filter: none; } .reel img { transition: none; filter: blur(8px); } }
</style>
</head>
<body>
<div class="reel" id="reel" aria-hidden="true"><img id="frame" alt=""><video id="vid" muted loop playsinline autoplay preload="auto" disablepictureinpicture></video></div>
<div class="veil"></div>
<div class="edge t" aria-hidden="true"></div><div class="edge b" aria-hidden="true"></div>

<main>
  <div class="stage">
    <p class="line" id="line" aria-label="soon." style="margin-top:0">soon.</p>
  </div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var SITE = 'https://vault-y6mf.vercel.app/api/site', t0 = Date.now();
  var q = new URLSearchParams(location.search), source = (q.get('ref') || q.get('utm_source') || (/instagram/i.test(navigator.userAgent) ? 'ig' : '') || 'direct').slice(0, 40);

  /* the same footage as the beta page: one loop per visit, the next one on the next visit */
  var ALL = [{ src: '/sycstem/bg/forest.webp', mp4: '/sycstem/bg/forest.mp4', f: 'blur(5px) saturate(.85) contrast(.45) brightness(1.75)', bg: '#ececea' },
             { src: '/sycstem/bg/glitch.webp', mp4: '/sycstem/bg/glitch.mp4', f: 'blur(5px) saturate(.85) contrast(.55) brightness(1.5)', bg: '#e9eaea' }], pick = 0;
  try {
    var ss = sessionStorage.getItem('gh_frame');
    if (ss !== null) pick = +ss % ALL.length;
    else { var last = localStorage.getItem('gh_frame_last'); pick = last === null ? Math.floor(Math.random() * ALL.length) : (+last + 1) % ALL.length; localStorage.setItem('gh_frame_last', pick); sessionStorage.setItem('gh_frame', pick); }
  } catch (e) { pick = Math.floor(Math.random() * ALL.length); }
  var F = ALL[pick], img = $('frame'), vid = $('vid');
  var c = F.bg, m = document.querySelector('meta[name="theme-color"]'), h = c.replace('#', '');
  document.documentElement.style.backgroundColor = c; document.body.style.backgroundColor = c; if (m) m.setAttribute('content', c);
  document.documentElement.style.setProperty('--edge-rgb', [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); }).join(', '));
  img.style.filter = vid.style.filter = F.f;
  img.onload = function () { img.classList.add('on'); }; img.src = F.src;
  vid.src = F.mp4; vid.muted = true;
  vid.addEventListener('playing', function () { vid.classList.add('on'); setTimeout(function () { img.classList.remove('on'); }, 1700); });
  var tryPlay = function () { var pr = vid.play(); if (pr && pr.catch) pr.catch(function () {}); };
  tryPlay(); document.addEventListener('visibilitychange', function () { if (!document.hidden) tryPlay(); });
  document.addEventListener('touchstart', tryPlay, { once: true, passive: true });

  /* the line, letter by letter out of the blur */
  var lineNow = 'soon.';
  try { var hc = JSON.parse(localStorage.getItem('gh_home') || 'null'); if (hc && hc.line) lineNow = hc.line; } catch (e) {}
  function buildLine(txt) {
    var el = $('line'), html = '', d = Math.max(0, 0.9 - (Date.now() - t0) / 1000);
    el.setAttribute('aria-label', txt);
    for (var i = 0; i < txt.length; i++) { var ch = txt[i]; html += ch === ' ' ? '<span class="sp" aria-hidden="true" style="animation-delay:' + d.toFixed(2) + 's">&nbsp;</span>' : '<span aria-hidden="true" style="animation-delay:' + d.toFixed(2) + 's">' + ch.replace(/[&<>]/g, function (x) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[x]; }) + '</span>'; d += ch === '.' ? 0.32 : 0.09; }
    el.innerHTML = html;
  }
  buildLine(lineNow);
  fetch(SITE + '/config', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    var hm = j && j.home; if (!hm) return;
    try { localStorage.setItem('gh_home', JSON.stringify(hm)); } catch (e) {}
    if (hm.mode === 'open') { location.replace('/work/' + location.search); return; }
    if (hm.line && hm.line !== lineNow && Date.now() - t0 < 800) { lineNow = hm.line; buildLine(lineNow); }
  }).catch(function () {});

  /* one anonymous visit count (no cookies, nothing about the person) */
  try {
    var first = !sessionStorage.getItem('syc_seen'); sessionStorage.setItem('syc_seen', '1');
    var ref = ''; try { ref = document.referrer ? new URL(document.referrer).host : ''; } catch (e) {}
    var hit = JSON.stringify({ page: 'home', src: source === 'direct' ? '' : source, ref: ref, first: first });
    if (navigator.sendBeacon) navigator.sendBeacon(SITE + '/hit', new Blob([hit], { type: 'text/plain' }));
  } catch (e) {}
})();
</script>
</body>
</html>
