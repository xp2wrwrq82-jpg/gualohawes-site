<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>the list</title>
<link rel="icon" href="/sycstem/mark.svg" type="image/svg+xml">
<style>
  /* gualo.site/admin — the beta list, in the same white world as the teaser (VEIL): footage under a white veil,
     the small grey mark, lowercase lines, white glass pills. No colour. */
  :root {
    --ink: #1d1d1f; --grey: #6e6e73; --soft: #a1a1a6; --line: #4a4a4f; --fine: #8e8e93;
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.22,.61,.36,1);
    --glass: rgba(255,255,255,.82);
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #f5f5f6; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  ::selection { background: #1d1d1f; color: #fff; }
  [hidden] { display: none !important; }

  .reel { position: fixed; inset: -6%; z-index: 0; pointer-events: none; }
  .reel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.6s var(--ease); }
  .reel video.on { opacity: 1; }
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 46%, rgba(255,255,255,.88) 0%, rgba(255,255,255,.85) 55%, rgba(250,250,251,.87) 100%); }

  @keyframes appear { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: none; } }
  .mark { width: 14px; height: 14px; color: var(--soft); flex: 0 0 auto; }

  /* ── signed out: one line, one pill at a time ── */
  .gate { position: relative; z-index: 2; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px 96px; text-align: center; }
  .gate .stage { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; animation: appear 1.2s var(--ease) both; }
  .gate .line { margin-top: 28px; font-size: 14px; letter-spacing: .06em; color: var(--line); }
  .gate form { width: 100%; margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
  .pill { position: relative; display: flex; align-items: center; height: 52px; border-radius: 999px; background: var(--glass);
    backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10), 0 10px 30px rgba(30,30,40,.06); transition: box-shadow .3s var(--ease); }
  .pill:focus-within { box-shadow: inset 0 0 0 .5px rgba(0,0,0,.24), 0 12px 36px rgba(30,30,40,.09); }
  .pill input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; padding: 0 0 0 22px;
    font: 400 16px var(--sans); letter-spacing: -.01em; color: var(--ink); }
  .pill input::placeholder { color: var(--soft); }
  .arrow { flex: 0 0 auto; width: 36px; height: 36px; margin-right: 8px; border: 0; border-radius: 50%; cursor: pointer; background: transparent;
    color: var(--grey); display: grid; place-items: center; transition: color .25s var(--ease), background .25s var(--ease), opacity .25s; }
  .arrow svg { width: 15px; height: 15px; }
  .pill:focus-within .arrow, .arrow:hover { color: var(--ink); background: rgba(0,0,0,.04); }
  .arrow:disabled { opacity: .4; cursor: default; }
  .go { width: 100%; justify-content: center; border: 0; cursor: pointer; font: 400 15px var(--sans); letter-spacing: .01em; color: var(--ink); gap: 10px; }
  .go:disabled { opacity: .55; cursor: default; }
  .go svg { width: 15px; height: 15px; color: var(--grey); }
  .note { margin-top: 16px; min-height: 16px; font-size: 12px; color: var(--grey); }
  .note.bad { color: #b3261e; }
  .quiet { margin-top: 18px; border: 0; background: none; font: 400 12px var(--sans); letter-spacing: .04em; color: var(--fine); cursor: pointer; }
  .quiet:hover { color: var(--ink); }
  .fine { position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); text-align: center;
    font-size: 11px; letter-spacing: .04em; color: var(--fine); pointer-events: none; }

  /* ── signed in: the list ── */
  .room { position: relative; z-index: 2; max-width: 760px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top, 0px)) 20px 120px; animation: appear 1s var(--ease) both; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top .who { flex: 1; min-width: 0; font-size: 12px; letter-spacing: .04em; color: var(--fine); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head { margin-top: 56px; text-align: center; }
  .count { font-size: 56px; font-weight: 300; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .count-l { margin-top: 12px; font-size: 14px; letter-spacing: .06em; color: var(--line); }
  .acts { margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .btn { height: 40px; padding: 0 20px; border: 0; border-radius: 999px; cursor: pointer; background: var(--glass);
    backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10), 0 8px 24px rgba(30,30,40,.05);
    font: 400 13px var(--sans); letter-spacing: .02em; color: var(--ink); transition: box-shadow .25s var(--ease), opacity .25s; }
  .btn:hover { box-shadow: inset 0 0 0 .5px rgba(0,0,0,.22), 0 10px 28px rgba(30,30,40,.08); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.plain { background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; color: var(--fine); padding: 0 6px; height: auto; font-size: 12px; letter-spacing: .04em; }
  .btn.plain:hover { color: var(--ink); }
  #status:empty { display: none; }
  .status { margin-top: 14px; min-height: 16px; text-align: center; font-size: 12px; color: var(--fine); }
  .status.bad { color: #b3261e; }

  .list { margin-top: 40px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08), 0 18px 50px rgba(30,30,40,.06); overflow: hidden; }
  .row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; padding: 16px 22px; }
  .row + .row { box-shadow: inset 0 .5px 0 rgba(0,0,0,.08); }
  .row .no { grid-row: span 2; font-size: 12px; color: var(--soft); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .row .em { font-size: 15px; color: var(--ink); overflow-wrap: anywhere; }
  .row .em a { color: inherit; text-decoration: none; }
  .row .at { font-size: 12px; color: var(--fine); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
  .row .meta { grid-column: 2 / 4; font-size: 12px; letter-spacing: .02em; color: var(--grey); }
  .row .meta a { color: inherit; text-decoration: none; }
  .row .meta a:hover, .row .em a:hover { color: var(--ink); }
  .row.new .no { color: var(--ink); }
  .row.new .no::after { content: "new"; display: block; margin-top: 3px; font-size: 11px; color: var(--fine); }
  .tabs { margin-top: 30px; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .tab { height: 34px; padding: 0 16px; border: 0; border-radius: 999px; cursor: pointer; background: transparent; font: 400 13px var(--sans); letter-spacing: .02em; color: var(--fine); transition: color .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease); }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); background: var(--glass); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10), 0 8px 24px rgba(30,30,40,.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .pane[hidden] { display: none !important; }
  /* visits */
  .nums { margin-top: 26px; display: flex; justify-content: center; gap: 34px; flex-wrap: wrap; text-align: center; }
  .nums b { display: block; font-size: 22px; font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
  .nums span { font-size: 12px; letter-spacing: .04em; color: var(--fine); }
  .chart { margin-top: 36px; padding: 22px 22px 14px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08), 0 18px 50px rgba(30,30,40,.06); }
  .bars { height: 120px; display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 4px; align-items: end; }
  .bar { position: relative; border-radius: 3px 3px 1px 1px; background: rgba(29,29,31,.16); min-height: 2px; }
  .bar i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: inherit; background: rgba(29,29,31,.42); }
  .bar.today { background: rgba(29,29,31,.26); }
  .axis { margin-top: 10px; display: flex; justify-content: space-between; font-size: 11px; color: var(--fine); font-variant-numeric: tabular-nums; }
  .key { margin-top: 10px; text-align: center; font-size: 11px; color: var(--fine); letter-spacing: .03em; }
  .key em { font-style: normal; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 5px -1px 12px; background: rgba(29,29,31,.42); }
  .key em.lt { background: rgba(29,29,31,.16); }
  .srcs { margin-top: 18px; padding: 8px 22px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08), 0 18px 50px rgba(30,30,40,.06); }
  .src { display: grid; grid-template-columns: 110px minmax(0, 1fr) 44px; gap: 14px; align-items: center; padding: 10px 0; font-size: 13px; color: var(--line); }
  .src + .src { box-shadow: inset 0 .5px 0 rgba(0,0,0,.08); }
  .src .track { height: 6px; border-radius: 3px; background: rgba(29,29,31,.08); overflow: hidden; }
  .src .track i { display: block; height: 100%; border-radius: 3px; background: rgba(29,29,31,.38); }
  .src b { font-weight: 400; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  /* beta page settings */
  .set { margin: 36px auto 0; max-width: 520px; display: flex; flex-direction: column; gap: 12px; }
  .set .lbl { margin-top: 14px; font-size: 11px; letter-spacing: .08em; color: var(--fine); text-align: center; }
  .loops { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .loop { position: relative; display: block; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; cursor: pointer; background: #f5f5f6;
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10), 0 10px 30px rgba(30,30,40,.06); transition: opacity .3s var(--ease), box-shadow .3s var(--ease); }
  .loop video { position: absolute; inset: -6%; width: 112%; height: 112%; object-fit: cover; }
  .loop::after { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.84); }
  .loop span { position: absolute; z-index: 1; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 12px; letter-spacing: .06em; color: var(--line); }
  .loop input { position: absolute; opacity: 0; pointer-events: none; }
  .loop:not(.on) { opacity: .42; }
  .loop.on { box-shadow: inset 0 0 0 1px rgba(0,0,0,.28), 0 12px 34px rgba(30,30,40,.09); }
  .seg { align-self: center; display: inline-flex; padding: 4px; border-radius: 999px; background: var(--glass); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10); }
  .seg button { height: 32px; padding: 0 18px; border: 0; border-radius: 999px; cursor: pointer; background: transparent; font: 400 13px var(--sans); color: var(--fine); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 10px rgba(30,30,40,.08); }
  .set .row { margin-top: 18px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; align-items: center; }
  .set a.btn { display: inline-flex; align-items: center; text-decoration: none; }
  .devs { margin-top: 44px; text-align: center; }
  .devs .lbl { font-size: 11px; letter-spacing: .08em; color: var(--fine); }
  .devs ul { list-style: none; margin-top: 12px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .devs li { font-size: 13px; color: var(--line); }
  .devs li .when { color: var(--fine); }
  .devs li button { margin-left: 8px; }
  .devs .btn { margin-top: 16px; }
  .empty { padding: 44px 22px; text-align: center; font-size: 14px; letter-spacing: .06em; color: var(--line); }
  @media (max-width: 520px) {
    .row { grid-template-columns: 52px minmax(0, 1fr); padding: 14px 18px; }
    .row .at { grid-column: 2; text-align: left; }
    .row .meta { grid-column: 2; }
    .row .no { grid-row: span 3; }
    .count { font-size: 48px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="reel" aria-hidden="true"><video id="vid" muted loop playsinline autoplay preload="auto" disablepictureinpicture></video></div>
<div class="veil"></div>

<!-- signed out -->
<main class="gate" id="gate" hidden>
  <div class="stage">
    <svg class="mark" viewBox="0 0 1000 991.86" fill="currentColor" aria-hidden="true"><path d="M11.27,176.80L83.75,335.66A124.94,124.94 0 0 0 311.09,231.94L238.61,73.08A124.94,124.94 0 0 0 11.27,176.80Z"/><path d="M761.39,73.08L688.91,231.94A124.94,124.94 0 0 0 916.25,335.66L988.73,176.80A124.94,124.94 0 0 0 761.39,73.08Z"/><path d="M83.75,656.20L11.27,815.06A124.94,124.94 0 0 0 238.61,918.77L311.09,759.91A124.94,124.94 0 0 0 83.75,656.20Z"/><path d="M688.91,759.91L761.39,918.77A124.94,124.94 0 0 0 988.73,815.06L916.25,656.20A124.94,124.94 0 0 0 688.91,759.91Z"/></svg>
    <p class="line" id="gline">the list.</p>

    <form id="fSign" novalidate>
      <button class="pill go" id="sGo" type="submit"><span id="sLbl">sign in</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8h9.5M8.6 3.9 12.7 8l-4.1 4.1"/></svg></button>
    </form>

    <form id="fLink" novalidate hidden>
      <div class="pill">
        <input type="email" id="kEmail" placeholder="Email" autocomplete="username" inputmode="email" aria-label="Email" required>
        <button class="arrow" id="kGo" type="submit" aria-label="Email me a link"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8h9.5M8.6 3.9 12.7 8l-4.1 4.1"/></svg></button>
      </div>
    </form>

    <form id="fSetup" novalidate hidden>
      <button class="pill go" id="uGo" type="submit"><span id="uLbl">use face id</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8h9.5M8.6 3.9 12.7 8l-4.1 4.1"/></svg></button>
    </form>

    <p class="note" id="gnote" role="status" aria-live="polite"></p>
    <button class="quiet" id="toLink" type="button">new device? email me a link</button>
    <button class="quiet" id="toLogin" type="button" hidden>back</button>
  </div>
</main>

<!-- signed in -->
<main class="room" id="room" hidden>
  <div class="top">
    <svg class="mark" viewBox="0 0 1000 991.86" fill="currentColor" aria-hidden="true"><path d="M11.27,176.80L83.75,335.66A124.94,124.94 0 0 0 311.09,231.94L238.61,73.08A124.94,124.94 0 0 0 11.27,176.80Z"/><path d="M761.39,73.08L688.91,231.94A124.94,124.94 0 0 0 916.25,335.66L988.73,176.80A124.94,124.94 0 0 0 761.39,73.08Z"/><path d="M83.75,656.20L11.27,815.06A124.94,124.94 0 0 0 238.61,918.77L311.09,759.91A124.94,124.94 0 0 0 83.75,656.20Z"/><path d="M688.91,759.91L761.39,918.77A124.94,124.94 0 0 0 988.73,815.06L916.25,656.20A124.94,124.94 0 0 0 688.91,759.91Z"/></svg>
    <span class="who" id="who"></span>
    <button class="btn plain" id="out" type="button">sign out</button>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" type="button" data-tab="list">the list</button>
    <button class="tab" type="button" data-tab="visits">visits</button>
    <button class="tab" type="button" data-tab="page">beta page</button>
  </nav>
  <section class="pane" id="pane-list">
  <div class="head">
    <div class="count" id="count">–</div>
    <div class="count-l" id="countL">on the list.</div>
    <div class="acts">
      <button class="btn" id="csv" type="button">download csv</button>
      <button class="btn" id="test" type="button">send test alert</button>
    </div>
    <div class="status" id="alerts"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
  <div class="list" id="list"></div>
  </section>

  <section class="pane" id="pane-visits" hidden>
    <div class="head">
      <div class="count" id="v7">–</div>
      <div class="count-l">visits this week.</div>
    </div>
    <div class="nums" id="vnums"></div>
    <div class="chart"><div class="bars" id="bars"></div><div class="axis" id="axis"></div>
      <div class="key"><em></em>beta page<em class="lt"></em>gualo.site</div></div>
    <div class="srcs" id="srcs"></div>
    <div class="status" id="vstatus"></div>
  </section>

  <section class="pane" id="pane-page" hidden>
    <form class="set" id="fCfg" novalidate>
      <div class="lbl">the line</div>
      <div class="pill"><input type="text" id="cLine" maxlength="60" placeholder="private beta soon. by invitation." aria-label="The line" autocomplete="off"></div>
      <div class="lbl">fine print</div>
      <div class="pill"><input type="text" id="cFine" maxlength="60" placeholder="Technology by Gualo Hawes" aria-label="Fine print" autocomplete="off"></div>
      <div class="lbl">loops (one per visit, alternating)</div>
      <div class="loops" id="cLoops"></div>
      <div class="lbl">the list</div>
      <div class="seg" id="cSign"><button type="button" data-v="open">open</button><button type="button" data-v="paused">paused</button></div>
      <div class="row"><button class="btn" id="cSave" type="submit">save</button><a class="btn plain" href="/sycstem/" target="_blank" rel="noopener">view the page</a></div>
      <div class="status" id="cstatus" role="status" aria-live="polite"></div>
    </form>
  </section>

  <div class="devs" id="devs">
    <div class="lbl" id="devLbl">face id / touch id</div>
    <ul id="devList"></ul>
    <button class="btn" id="addDev" type="button">add this device</button>
  </div>
</main>

<p class="fine" id="fine">Technology by Gualo Hawes</p>

<script>
(function () {
  var API = 'https://vault-y6mf.vercel.app/api/beta/admin';
  var KEY = 'syc_admin', SEEN = 'syc_admin_seen';
  var $ = function (id) { return document.getElementById(id); };
  var session = null; try { session = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}

  /* the same footage as the teaser, one loop per visit */
  var LOOPS = [{ mp4: '/sycstem/bg/forest.mp4', f: 'blur(5px) saturate(.85) contrast(.45) brightness(1.75)' }, { mp4: '/sycstem/bg/glitch.mp4', f: 'blur(5px) saturate(.85) contrast(.55) brightness(1.5)' }];
  var pick = 0; try { var ss = sessionStorage.getItem('syc_admin_frame'); pick = ss !== null ? +ss % 2 : Math.floor(Math.random() * 2); sessionStorage.setItem('syc_admin_frame', pick); } catch (e) {}
  var vid = $('vid'); vid.style.filter = LOOPS[pick].f; vid.src = LOOPS[pick].mp4; vid.muted = true;
  vid.addEventListener('playing', function () { vid.classList.add('on'); });
  var play = function () { var p = vid.play(); if (p && p.catch) p.catch(function () {}); };
  play(); document.addEventListener('touchstart', play, { once: true, passive: true });

  function call(path, opts) {
    opts = opts || {}; var h = { 'Content-Type': 'application/json' };
    if (session && session.token) h.Authorization = 'Bearer ' + session.token;
    return fetch(API + path, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401 && session && !/^\/(login|reset|passkey)/.test(path)) { signOut('signed out — sign in again.'); throw new Error('signed out'); }
        if (opts.raw) { if (!r.ok) throw new Error('Something went wrong.'); return r; }
        return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || 'Something went wrong.'); return j; });
      });
  }
  function note(t, bad) { var n = $('gnote'); n.textContent = t || ''; n.className = 'note' + (bad ? ' bad' : ''); }
  function status(t, bad) { var s = $('status'); s.textContent = t || ''; s.className = 'status' + (bad ? ' bad' : ''); }

  /* ── passkeys: Touch ID on the Mac, Face ID on the iPhone (WebAuthn) ── */
  var PK = (function () {
    function b2u(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
    function u2b(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a.buffer; }
    function ids(list) { return (list || []).map(function (c) { var o = { type: c.type, id: u2b(c.id) }; if (c.transports) o.transports = c.transports; return o; }); }
    return {
      supported: function () { return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); },
      create: function (o) {
        var pk = Object.assign({}, o, { challenge: u2b(o.challenge), user: Object.assign({}, o.user, { id: u2b(o.user.id) }), excludeCredentials: ids(o.excludeCredentials) });
        return navigator.credentials.create({ publicKey: pk }).then(function (c) {
          return { id: c.id, rawId: b2u(c.rawId), type: c.type, response: { clientDataJSON: b2u(c.response.clientDataJSON), attestationObject: b2u(c.response.attestationObject), transports: c.response.getTransports ? c.response.getTransports() : [] } };
        });
      },
      get: function (o) {
        var pk = Object.assign({}, o, { challenge: u2b(o.challenge), allowCredentials: ids(o.allowCredentials) });
        return navigator.credentials.get({ publicKey: pk }).then(function (c) {
          return { id: c.id, rawId: b2u(c.rawId), type: c.type, response: { clientDataJSON: b2u(c.response.clientDataJSON), authenticatorData: b2u(c.response.authenticatorData), signature: b2u(c.response.signature), userHandle: c.response.userHandle ? b2u(c.response.userHandle) : null } };
        });
      }
    };
  })();
  var ua = navigator.userAgent, isPhone = /iPhone|iPad|Android/.test(ua), isMac = /Macintosh|Mac OS X/.test(ua) && !isPhone;
  var BIO = /iPhone|iPad/.test(ua) ? 'face id' : isMac ? 'touch id' : 'a passkey';
  $('sLbl').textContent = 'sign in with ' + BIO; $('uLbl').textContent = 'use ' + BIO;
  function deviceError(err, kind) {
    var n = err && err.name;
    if ((n === 'NotAllowedError' || n === 'AbortError') && kind === 'login') return 'didn’t go through. first time on this device? email yourself a link below.';
    if (n === 'NotAllowedError' || n === 'AbortError') return 'cancelled — tap to try again.';
    if (n === 'InvalidStateError') return 'this device is already set up — just sign in.';
    if (n === 'SecurityError') return 'open this page at gualo.site/admin.';
    return (err && err.message) || 'something went wrong.';
  }
  // one ceremony: ask for options, let the device sign, send it back
  function ceremony(kind, extra) {
    if (!PK.supported()) return Promise.reject(new Error('this browser can’t do ' + BIO + ' — open gualo.site/admin in safari or chrome.'));
    return call('/passkey/options', { method: 'POST', body: Object.assign({ kind: kind }, extra) }).then(function (o) {
      return (kind === 'login' ? PK.get(o.options) : PK.create(o.options)).then(function (cred) {
        return call('/passkey/verify', { method: 'POST', body: Object.assign({ kind: kind, state: o.state, credential: cred }, extra) });
      });
    });
  }

  /* ── gate ── */
  var setupToken = null;
  function gate(mode) {
    $('room').hidden = true; $('gate').hidden = false; $('fine').hidden = false;
    $('fSign').hidden = mode !== 'login'; $('fLink').hidden = mode !== 'link'; $('fSetup').hidden = mode !== 'setup';
    $('toLink').hidden = mode !== 'login'; $('toLogin').hidden = mode === 'login';
    $('gline').textContent = mode === 'link' ? 'we’ll email you a link.' : mode === 'setup' ? 'set up this device.' : 'the list.';
    if (mode === 'link') setTimeout(function () { try { $('kEmail').focus({ preventScroll: true }); } catch (e) {} }, 60);
  }
  function signIn(j) { session = { token: j.token, email: j.email }; try { localStorage.setItem(KEY, JSON.stringify(session)); } catch (e) {} room(); }
  function signOut(msg) { session = null; try { localStorage.removeItem(KEY); } catch (e) {} gate('login'); note(msg || ''); }

  $('fSign').addEventListener('submit', function (e) {
    e.preventDefault(); $('sGo').disabled = true; note('');
    ceremony('login', {}).then(signIn).catch(function (err) { note(deviceError(err, 'login'), true); }).then(function () { $('sGo').disabled = false; });
  });
  $('fLink').addEventListener('submit', function (e) {
    e.preventDefault(); var em = $('kEmail').value.trim(); if (!em) return;
    $('kGo').disabled = true; note('');
    call('/reset', { method: 'POST', body: { email: em } }).then(function () { note('if that’s the admin email, a link is in its inbox. open it on this device.'); })
      .catch(function (err) { note(err.message, true); }).then(function () { $('kGo').disabled = false; });
  });
  $('fSetup').addEventListener('submit', function (e) {
    e.preventDefault(); $('uGo').disabled = true; note('');
    ceremony('register', { setup: setupToken }).then(function (j) { history.replaceState(null, '', location.pathname); signIn(j); status('this ' + (isMac ? 'mac' : isPhone ? 'phone' : 'device') + ' is set up — next time, just ' + BIO + '.'); })
      .catch(function (err) { note(deviceError(err), true); }).then(function () { $('uGo').disabled = false; });
  });
  $('toLink').addEventListener('click', function () { note(''); gate('link'); });
  $('toLogin').addEventListener('click', function () { note(''); history.replaceState(null, '', location.pathname); gate('login'); });

  /* ── the list ── */
  var FROM = { ig: 'Instagram', site: 'gualo.site', direct: 'direct link', test: 'test' };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var when = function (iso) { var d = new Date(iso); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase(); };
  var place = function (n) { return 'no. ' + String(n).padStart(3, '0'); };

  function room() {
    $('gate').hidden = true; $('room').hidden = false; $('fine').hidden = true;
    $('who').textContent = session.email || ''; load(); showTab(TAB);
  }
  function load() {
    return call('/list').then(function (j) {
      var seen = 0; try { seen = +localStorage.getItem(SEEN) || 0; } catch (e) {}
      $('count').textContent = j.total;
      var al = $('alerts'); al.textContent = j.alerts.on ? 'email alerts on → ' + (j.alerts.to || '') : 'email alerts off — the key isn’t set on Vercel yet.'; al.className = 'status' + (j.alerts.on ? '' : ' bad');
      $('list').innerHTML = j.rows.length ? j.rows.map(function (r) {
        var meta = [];
        if (r.handle) meta.push('<a href="https://instagram.com/' + encodeURIComponent(r.handle) + '" target="_blank" rel="noreferrer">@' + esc(r.handle) + '</a>');
        meta.push('from ' + esc(FROM[r.source] || r.source || 'direct link'));
        return '<div class="row' + (seen && r.n > seen ? ' new' : '') + '"><span class="no">' + place(r.n) + '</span>' +
          '<span class="em"><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></span><span class="at">' + when(r.at) + '</span>' +
          '<span class="meta">' + meta.join(' · ') + '</span></div>';
      }).join('') : '<div class="empty">no one yet. post the link.</div>';
      try { localStorage.setItem(SEEN, String(j.total)); } catch (e) {}
      var devs = j.devices || [];
      $('devLbl').textContent = devs.length ? BIO === 'a passkey' ? 'passkeys' : 'face id / touch id' : 'no face id / touch id yet';
      $('devList').innerHTML = devs.map(function (d) {
        return '<li>' + esc(d.name) + ' <span class="when">· ' + (d.used ? 'used ' + when(d.used).split(' · ')[0] : 'added ' + when(d.added).split(' · ')[0]) + '</span>' +
          '<button class="btn plain" type="button" data-rm="' + esc(d.id) + '" data-name="' + esc(d.name) + '">remove</button></li>';
      }).join('');
    }).catch(function (err) { if (err.message !== 'signed out') status(err.message, true); });
  }
  $('out').addEventListener('click', function () { signOut(''); });
  $('addDev').addEventListener('click', function () {
    var b = this; b.disabled = true; status('');
    ceremony('register', {}).then(function () { status('added — next time, just ' + BIO + '.'); load(); })
      .catch(function (err) { status(deviceError(err), true); }).then(function () { b.disabled = false; });
  });
  var armed = null;
  $('devList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rm]'); if (!b) return;
    if (armed !== b) { if (armed) armed.textContent = 'remove'; armed = b; b.textContent = 'tap again to remove'; return; }
    b.disabled = true;
    call('/passkey/remove', { method: 'POST', body: { id: b.getAttribute('data-rm') } }).then(function () { status(b.getAttribute('data-name') + ' removed.'); armed = null; load(); })
      .catch(function (err) { status(err.message, true); b.disabled = false; });
  });
  $('test').addEventListener('click', function () {
    var b = this; b.disabled = true; status('sending…');
    call('/test-alert', { method: 'POST' }).then(function (j) { status('sent to ' + j.to + ' — check your inbox (and promotions / spam the first time).'); })
      .catch(function (err) { status(err.message, true); }).then(function () { b.disabled = false; });
  });
  $('csv').addEventListener('click', function () {
    var b = this; b.disabled = true;
    call('/csv', { raw: true }).then(function (r) { return r.blob(); }).then(function (blob) {
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'sycstem-beta-list-' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }).catch(function (err) { status(err.message, true); }).then(function () { b.disabled = false; });
  });
  /* ── tabs ── */
  var TAB = 'list'; try { TAB = localStorage.getItem('syc_admin_tab') || 'list'; } catch (e) {}
  function showTab(t) {
    TAB = t; try { localStorage.setItem('syc_admin_tab', t); } catch (e) {}
    [].forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
    $('pane-list').hidden = t !== 'list'; $('pane-visits').hidden = t !== 'visits'; $('pane-page').hidden = t !== 'page';
    if (t === 'visits') loadStats(); if (t === 'page') loadCfg();
  }
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) showTab(b.getAttribute('data-tab')); });

  /* ── visits ── */
  var SRC = { ig: 'Instagram', direct: 'direct / typed', google: 'Google', x: 'X', tiktok: 'TikTok', youtube: 'YouTube', site: 'gualo.site', test: 'test' };
  function loadStats() {
    return call('/stats').then(function (j) {
      var t = j.totals; $('v7').textContent = t.home7 + t.beta7;
      $('vnums').innerHTML = [[t.beta7, 'beta page · 7 days'], [t.home7, 'gualo.site · 7 days'], [t.beta30 + t.home30, 'visits · 30 days'],
        [t.signups30, 'joined the list · 30 days'], [t.beta30 ? Math.round(100 * t.signups30 / t.beta30) + '%' : '–', 'of beta-page visits joined']]
        .map(function (n) { return '<div><b>' + n[0] + '</b><span>' + n[1] + '</span></div>'; }).join('');
      var max = Math.max(1, Math.max.apply(null, j.days.map(function (d) { return d.home + d.beta; })));
      $('bars').innerHTML = j.days.map(function (d, i) {
        var tot = d.home + d.beta;
        return '<div class="bar' + (i === j.days.length - 1 ? ' today' : '') + '" style="height:' + (100 * tot / max).toFixed(1) + '%" title="' + d.day + ' · ' + d.beta + ' beta page · ' + d.home + ' gualo.site"><i style="height:' + (tot ? 100 * d.beta / tot : 0).toFixed(1) + '%"></i></div>';
      }).join('');
      var lab = function (day) { var p = day.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
      $('axis').innerHTML = '<span>' + lab(j.days[0].day) + '</span><span>' + lab(j.days[15].day) + '</span><span>today</span>';
      var top = Math.max(1, j.sources.length ? j.sources[0].visits : 1);
      $('srcs').innerHTML = j.sources.length ? j.sources.slice(0, 8).map(function (r) {
        return '<div class="src"><span>' + esc(SRC[r.source] || r.source) + '</span><span class="track"><i style="width:' + (100 * r.visits / top).toFixed(1) + '%"></i></span><b>' + r.visits + '</b></div>';
      }).join('') : '<div class="empty">no visits counted yet.</div>';
      $('vstatus').textContent = 'counted by your own site: no cookies, nothing about the person.';
    }).catch(function (err) { if (err.message !== 'signed out') { $('vstatus').textContent = err.message; } });
  }

  /* ── beta page settings ── */
  var LOOPS = [{ name: 'forest', mp4: '/sycstem/bg/forest.mp4', f: 'blur(5px) saturate(.85) contrast(.45) brightness(1.75)' },
               { name: 'glitch', mp4: '/sycstem/bg/glitch.mp4', f: 'blur(5px) saturate(.85) contrast(.55) brightness(1.5)' }];
  var cfgSign = 'open';
  $('cLoops').innerHTML = LOOPS.map(function (l) {
    return '<label class="loop on" data-loop="' + l.name + '"><video muted loop playsinline autoplay preload="metadata" src="' + l.mp4 + '" style="filter:' + l.f + '"></video><input type="checkbox" checked><span>' + l.name + '</span></label>';
  }).join('');
  $('cLoops').addEventListener('change', function (e) { var lab = e.target.closest('.loop'); if (lab) lab.classList.toggle('on', e.target.checked); });
  function setSign(v) { cfgSign = v; [].forEach.call($('cSign').children, function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); }); }
  $('cSign').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setSign(b.getAttribute('data-v')); });
  function loadCfg() {
    return call('/config').then(function (j) {
      var t = j.teaser; $('cLine').value = t.line; $('cFine').value = t.fine; setSign(t.signups);
      [].forEach.call(document.querySelectorAll('.loop'), function (lab) { var on = t.loops.indexOf(lab.getAttribute('data-loop')) >= 0; lab.classList.toggle('on', on); lab.querySelector('input').checked = on; });
      $('cstatus').textContent = '';
    }).catch(function (err) { if (err.message !== 'signed out') $('cstatus').textContent = err.message; });
  }
  $('fCfg').addEventListener('submit', function (e) {
    e.preventDefault();
    var loops = [].filter.call(document.querySelectorAll('.loop'), function (l) { return l.querySelector('input').checked; }).map(function (l) { return l.getAttribute('data-loop'); });
    var b = $('cSave'); b.disabled = true; var st = $('cstatus'); st.className = 'status'; st.textContent = 'saving…';
    call('/config', { method: 'POST', body: { teaser: { line: $('cLine').value, fine: $('cFine').value, loops: loops, signups: cfgSign } } })
      .then(function () { st.textContent = 'saved — the page shows it within about 20 seconds.'; })
      .catch(function (err) { st.textContent = err.message; st.className = 'status bad'; }).then(function () { b.disabled = false; });
  });

  // keep it current while it's open
  setInterval(function () { if (session && !document.hidden) { load(); if (TAB === 'visits') loadStats(); } }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && session) { load(); play(); } });

  /* start: a reset link, a saved session, or the sign-in */
  function start() {
    var m = location.hash.match(/^#(?:setup|reset)=([\w.-]+)$/);
    note('');
    if (m) { setupToken = m[1]; gate('setup'); }
    else if (session && session.token) room();
    else gate('login');
  }
  start();
  window.addEventListener('hashchange', start); // the setup link opened in a tab that already had the page
})();
</script>
</body>
</html>
