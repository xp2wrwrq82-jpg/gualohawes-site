<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>the list</title>
<link rel="icon" href="/sycstem/mark.svg" type="image/svg+xml">
<style>
  /* gualo.site/admin — the beta list, in the same white world as the teaser (VEIL): footage under a white veil,
     the small grey mark, lowercase lines, white glass pills. No colour. */
  :root {
    --ink: #1d1d1f; --grey: #6e6e73; --soft: #a1a1a6; --line: #4a4a4f; --fine: #8e8e93;
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.22,.61,.36,1);
    --glass: rgba(255,255,255,.82);
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #f5f5f6; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  ::selection { background: #1d1d1f; color: #fff; }
  [hidden] { display: none !important; }

  .reel { position: fixed; inset: -6%; z-index: 0; pointer-events: none; }
  .reel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.6s var(--ease); }
  .reel video.on { opacity: 1; }
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 46%, rgba(255,255,255,.88) 0%, rgba(255,255,255,.85) 55%, rgba(250,250,251,.87) 100%); }
  /* phones: the footage and the veil cover the LARGEST screen (behind Safari's toolbars as they slide away) and nothing rubber-bands */
  html { background: #f5f5f6; overscroll-behavior: none; }
  @supports (height: 100lvh) {
    .reel { inset: auto; top: -6lvh; left: -6vw; width: 112vw; height: 112lvh; }
    .veil { inset: auto; top: 0; left: 0; width: 100vw; height: 100lvh; }
  }


  @keyframes appear { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: none; } }
  .mark { width: 14px; height: 14px; color: var(--soft); flex: 0 0 auto; }

  /* ── signed out: one line, one pill at a time ── */
  .gate { position: relative; z-index: 2; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px 96px; text-align: center; }
  .gate .stage { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; animation: appear 1.2s var(--ease) both; }
  .gate .line { margin-top: 28px; font-size: 14px; letter-spacing: .06em; color: var(--line); }
  .gate form { width: 100%; margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
  .pill { position: relative; display: flex; align-items: center; height: 52px; border-radius: 999px; background: var(--glass);
    backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10), 0 10px 30px rgba(30,30,40,.06); transition: box-shadow .3s var(--ease); }
  .pill:focus-within { box-shadow: inset 0 0 0 .5px rgba(0,0,0,.24), 0 12px 36px rgba(30,30,40,.09); }
  .pill input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; padding: 0 0 0 22px;
    font: 400 16px var(--sans); letter-spacing: -.01em; color: var(--ink); }
  .pill input::placeholder { color: var(--soft); }
  .arrow { flex: 0 0 auto; width: 36px; height: 36px; margin-right: 8px; border: 0; border-radius: 50%; cursor: pointer; background: transparent;
    color: var(--grey); display: grid; place-items: center; transition: color .25s var(--ease), background .25s var(--ease), opacity .25s; }
  .arrow svg { width: 15px; height: 15px; }
  .pill:focus-within .arrow, .arrow:hover { color: var(--ink); background: rgba(0,0,0,.04); }
  .arrow:disabled { opacity: .4; cursor: default; }
  .go { width: 100%; justify-content: center; border: 0; cursor: pointer; font: 400 15px var(--sans); letter-spacing: .01em; color: var(--ink); gap: 10px; }
  .go:disabled { opacity: .55; cursor: default; }
  .go svg { width: 15px; height: 15px; color: var(--grey); }
  .note { margin-top: 16px; min-height: 16px; font-size: 12px; color: var(--grey); }
  .note.bad { color: #b3261e; }
  .quiet { margin-top: 18px; border: 0; background: none; font: 400 12px var(--sans); letter-spacing: .04em; color: var(--fine); cursor: pointer; }
  .quiet:hover { color: var(--ink); }
  .fine { position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); text-align: center;
    font-size: 11px; letter-spacing: .04em; color: var(--fine); pointer-events: none; }

  /* ── signed in: the list ── */
  .room { position: relative; z-index: 2; max-width: 760px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top, 0px)) 20px 120px; animation: appear 1s var(--ease) both; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top #out { margin-left: auto; }
  .top .who { flex: 1; min-width: 0; font-size: 12px; letter-spacing: .04em; color: var(--fine); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head { margin-top: 56px; text-align: center; }
  .count { font-size: 56px; font-weight: 300; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .count-l { margin-top: 12px; font-size: 14px; letter-spacing: .06em; color: var(--line); }
  .acts { margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .btn { height: 40px; padding: 0 20px; border: 0; border-radius: 999px; cursor: pointer; background: var(--glass);
    backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10), 0 8px 24px rgba(30,30,40,.05);
    font: 400 13px var(--sans); letter-spacing: .02em; color: var(--ink); transition: box-shadow .25s var(--ease), opacity .25s; }
  .btn:hover { box-shadow: inset 0 0 0 .5px rgba(0,0,0,.22), 0 10px 28px rgba(30,30,40,.08); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.plain { background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; color: var(--fine); padding: 0 6px; height: auto; font-size: 12px; letter-spacing: .04em; }
  .btn.plain:hover { color: var(--ink); }
  #status:empty { display: none; }
  .status { margin-top: 14px; min-height: 16px; text-align: center; font-size: 12px; color: var(--fine); }
  .status.bad { color: #b3261e; }

  .list { margin-top: 40px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08), 0 18px 50px rgba(30,30,40,.06); overflow: hidden; }
  .row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; padding: 16px 22px; }
  .row + .row { box-shadow: inset 0 .5px 0 rgba(0,0,0,.08); }
  .row .no { grid-row: span 2; font-size: 12px; color: var(--soft); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .row .em { font-size: 15px; color: var(--ink); overflow-wrap: anywhere; }
  .row .em a { color: inherit; text-decoration: none; }
  .row .at { font-size: 12px; color: var(--fine); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
  .row .meta { grid-column: 2 / 4; font-size: 12px; letter-spacing: .02em; color: var(--grey); }
  .row .meta a { color: inherit; text-decoration: none; }
  .row .meta a:hover, .row .em a:hover { color: var(--ink); }
  /* live: a breathing dot while connected; a new signup arrives out of the blur with a soft highlight that fades */
  .live { margin-top: 12px; display: inline-flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: .06em; color: var(--fine); }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: #8e8e93; animation: breathe 2.4s ease-in-out infinite; }
  .live.off i { animation: none; opacity: .3; }
  @keyframes breathe { 0%, 100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  .row.fresh { animation: arrive 1.2s var(--ease) both, glow 7s ease-out both; }
  .seg { display: flex; gap: 4px; justify-content: center; margin-top: 14px; }
  .seg button { border: 0; background: none; cursor: pointer; font: 400 12px var(--sans, inherit); letter-spacing: .04em; color: #8e8e93; padding: 6px 12px; border-radius: 999px; transition: color .2s, background .2s; }
  .seg button.on { color: #1d1d1f; background: rgba(255,255,255,.8); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10); }
  .seg button b { font-weight: 400; font-variant-numeric: tabular-nums; opacity: .6; margin-left: 4px; }
  .tag { display: inline-block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #8e8e93; padding: 1px 6px; border-radius: 4px; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.14); margin-right: 2px; }
  @keyframes arrive { from { opacity: 0; filter: blur(8px); transform: translateY(-8px); } to { opacity: 1; filter: none; transform: none; } }
  @keyframes glow { from { background: rgba(29,29,31,.07); } to { background: rgba(29,29,31,0); } }
  .count.tick { animation: tick 1s var(--ease); }
  @keyframes tick { from { opacity: .15; filter: blur(8px); } to { opacity: 1; filter: none; } }
  .tab .badge { margin-left: 6px; font-size: 11px; color: var(--ink); }
  .live button { border: 0; background: none; padding: 0 0 0 4px; font: inherit; letter-spacing: inherit; color: var(--fine); cursor: pointer; }
  .live button:hover { color: var(--ink); }
  /* a new signup: light blooms from the count, the veil breathes thinner, a whisper under the count */
  .bloom { position: fixed; z-index: 3; width: 120vmax; height: 120vmax; margin: -60vmax 0 0 -60vmax; border-radius: 50%; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,.55) 18%, rgba(255,255,255,0) 52%); }
  .bloom.go { animation: bloom 2.6s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes bloom { 0% { opacity: 0; transform: scale(.08); } 22% { opacity: .9; } 100% { opacity: 0; transform: scale(1); } }
  .veil.breathe { animation: breathe-veil 2.8s ease-in-out; }
  @keyframes breathe-veil { 0%, 100% { opacity: 1; } 40% { opacity: .84; } }
  .whisper { min-height: 18px; margin-top: 10px; font-size: 13px; letter-spacing: .06em; color: var(--line); opacity: 0; }
  .whisper.go { animation: whisper 4.2s var(--ease) forwards; }
  @keyframes whisper { 0% { opacity: 0; filter: blur(6px); } 18%, 70% { opacity: 1; filter: none; } 100% { opacity: 0; filter: blur(4px); } }
  @media (prefers-reduced-motion: reduce) { .bloom, .veil.breathe { animation: none !important; } }
  .homecard { margin-top: 34px; align-items: center; text-align: center; }
  .homecard .note2 { font-size: 12px; color: var(--fine); line-height: 1.5; }
  .homecard .note2 a { color: var(--grey); }
  .row.new .no { color: var(--ink); }
  .row.new .no::after { content: "new"; display: block; margin-top: 3px; font-size: 11px; color: var(--fine); }
  .tabs { margin-top: 30px; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .tab { height: 34px; padding: 0 16px; border: 0; border-radius: 999px; cursor: pointer; background: transparent; font: 400 13px var(--sans); letter-spacing: .02em; color: var(--fine); transition: color .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease); }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); background: var(--glass); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10), 0 8px 24px rgba(30,30,40,.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .pane[hidden] { display: none !important; }
  /* visits */
  .nums { margin-top: 26px; display: flex; justify-content: center; gap: 34px; flex-wrap: wrap; text-align: center; }
  .nums b { display: block; font-size: 22px; font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
  .nums span { font-size: 12px; letter-spacing: .04em; color: var(--fine); }
  .chart { margin-top: 36px; padding: 22px 22px 14px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08), 0 18px 50px rgba(30,30,40,.06); }
  .bars { height: 120px; display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 4px; align-items: end; }
  .bar { position: relative; border-radius: 3px 3px 1px 1px; background: rgba(29,29,31,.16); min-height: 2px; }
  .bar i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: inherit; background: rgba(29,29,31,.42); }
  .bar.today { background: rgba(29,29,31,.26); }
  .axis { margin-top: 10px; display: flex; justify-content: space-between; font-size: 11px; color: var(--fine); font-variant-numeric: tabular-nums; }
  .key { margin-top: 10px; text-align: center; font-size: 11px; color: var(--fine); letter-spacing: .03em; }
  .key em { font-style: normal; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 5px -1px 12px; background: rgba(29,29,31,.42); }
  .key em.lt { background: rgba(29,29,31,.16); }
  .srcs { margin-top: 18px; padding: 8px 22px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08), 0 18px 50px rgba(30,30,40,.06); }
  .src { display: grid; grid-template-columns: 110px minmax(0, 1fr) 44px; gap: 14px; align-items: center; padding: 10px 0; font-size: 13px; color: var(--line); }
  .src + .src { box-shadow: inset 0 .5px 0 rgba(0,0,0,.08); }
  .src .track { height: 6px; border-radius: 3px; background: rgba(29,29,31,.08); overflow: hidden; }
  .src .track i { display: block; height: 100%; border-radius: 3px; background: rgba(29,29,31,.38); }
  .src b { font-weight: 400; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  /* beta page settings */
  .set { margin: 36px auto 0; max-width: 520px; display: flex; flex-direction: column; gap: 12px; }
  .set .lbl { margin-top: 14px; font-size: 11px; letter-spacing: .08em; color: var(--fine); text-align: center; }
  .loops { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .loop { position: relative; display: block; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; cursor: pointer; background: #f5f5f6;
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10), 0 10px 30px rgba(30,30,40,.06); transition: opacity .3s var(--ease), box-shadow .3s var(--ease); }
  .loop video { position: absolute; inset: -6%; width: 112%; height: 112%; object-fit: cover; }
  .loop::after { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.84); }
  .loop span { position: absolute; z-index: 1; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 12px; letter-spacing: .06em; color: var(--line); }
  .loop input { position: absolute; opacity: 0; pointer-events: none; }
  .loop:not(.on) { opacity: .42; }
  .loop.on { box-shadow: inset 0 0 0 1px rgba(0,0,0,.28), 0 12px 34px rgba(30,30,40,.09); }
  .seg { align-self: center; display: inline-flex; padding: 4px; border-radius: 999px; background: var(--glass); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10); }
  .seg button { height: 32px; padding: 0 18px; border: 0; border-radius: 999px; cursor: pointer; background: transparent; font: 400 13px var(--sans); color: var(--fine); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 10px rgba(30,30,40,.08); }
  .set .row { margin-top: 18px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; align-items: center; }
  .set a.btn { display: inline-flex; align-items: center; text-decoration: none; }
  /* site + shop editor */
  .ed { margin-top: 34px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 90px; }
  .ed h3 { margin: 22px 0 2px; text-align: center; font-size: 11px; font-weight: 400; letter-spacing: .08em; color: var(--fine); }
  .sec { padding: 18px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08), 0 18px 50px rgba(30,30,40,.06); display: flex; flex-direction: column; gap: 10px; }
  .sec .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fld { flex: 1 1 200px; min-width: 0; height: 40px; border: 0; outline: 0; border-radius: 12px; padding: 0 14px; background: rgba(255,255,255,.75);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10); font: 400 14px var(--sans); color: var(--ink); }
  .fld:focus { box-shadow: inset 0 0 0 .5px rgba(0,0,0,.28); }
  .fld.big { font-size: 15px; }
  textarea.fld { height: 84px; padding: 10px 14px; resize: vertical; line-height: 1.4; }
  .ib { height: 32px; min-width: 32px; padding: 0 10px; border: 0; border-radius: 999px; cursor: pointer; background: rgba(255,255,255,.7);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10); font: 400 12px var(--sans); color: var(--grey); }
  .ib:hover { color: var(--ink); }
  .ib.warn { color: #b3261e; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .it { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 14px; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08); }
  .it .th { position: relative; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; background: #e9e9ec; display: grid; place-items: center; font-size: 11px; color: var(--fine); text-align: center; padding: 6px; }
  .it .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .it .fld { height: 32px; flex: none; font-size: 12px; padding: 0 10px; border-radius: 9px; }
  .it .row { display: flex; gap: 4px; flex-wrap: wrap; }
  .it .row .ib { height: 26px; min-width: 26px; padding: 0 8px; font-size: 11px; }
  .add { align-self: flex-start; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--grey); cursor: pointer; }
  .chk input, .loop input { accent-color: var(--ink); }
  .savebar { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center;
    padding: 8px; border-radius: 999px; background: rgba(255,255,255,.86); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.10), 0 14px 40px rgba(30,30,40,.12); max-width: calc(100% - 32px); flex-wrap: wrap; justify-content: center; }
  .savebar .msg { font-size: 12px; color: var(--fine); padding: 0 8px; }
  .savebar .msg.bad { color: #b3261e; }
  .btn.ink { background: var(--ink); color: #fff; }
  .btn.ink:disabled { background: rgba(29,29,31,.35); }
  .devs { margin-top: 44px; text-align: center; }
  .devs .lbl { font-size: 11px; letter-spacing: .08em; color: var(--fine); }
  .devs ul { list-style: none; margin-top: 12px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .devs li { font-size: 13px; color: var(--line); }
  .devs li .when { color: var(--fine); }
  .devs li button { margin-left: 8px; }
  .devs .btn { margin-top: 16px; }
  .quietrow { margin-top: 22px; display: flex; justify-content: center; gap: 18px; }
  .quietrow .btn { margin-top: 0; }
  .empty { padding: 44px 22px; text-align: center; font-size: 14px; letter-spacing: .06em; color: var(--line); }
  @media (max-width: 520px) {
    .row { grid-template-columns: 52px minmax(0, 1fr); padding: 14px 18px; }
    .row .at { grid-column: 2; text-align: left; }
    .row .meta { grid-column: 2; }
    .row .no { grid-row: span 3; }
    .count { font-size: 48px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="reel" aria-hidden="true"><video id="vid" muted loop playsinline autoplay preload="auto" disablepictureinpicture></video></div>
<div class="veil"></div>
<div class="bloom" id="bloom" aria-hidden="true"></div>

<!-- signed out -->
<main class="gate" id="gate" hidden>
  <div class="stage">
    <svg class="mark" viewBox="0 0 1000 991.86" fill="currentColor" aria-hidden="true"><path d="M11.27,176.80L83.75,335.66A124.94,124.94 0 0 0 311.09,231.94L238.61,73.08A124.94,124.94 0 0 0 11.27,176.80Z"/><path d="M761.39,73.08L688.91,231.94A124.94,124.94 0 0 0 916.25,335.66L988.73,176.80A124.94,124.94 0 0 0 761.39,73.08Z"/><path d="M83.75,656.20L11.27,815.06A124.94,124.94 0 0 0 238.61,918.77L311.09,759.91A124.94,124.94 0 0 0 83.75,656.20Z"/><path d="M688.91,759.91L761.39,918.77A124.94,124.94 0 0 0 988.73,815.06L916.25,656.20A124.94,124.94 0 0 0 688.91,759.91Z"/></svg>
    <p class="line" id="gline">the list.</p>

    <form id="fSign" novalidate>
      <button class="pill go" id="sGo" type="submit"><span id="sLbl">sign in</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8h9.5M8.6 3.9 12.7 8l-4.1 4.1"/></svg></button>

      .then(function (j) { homeMode = j.home.mode; $('homeLine').value = j.home.line; homeView(); $('homeNote').insertAdjacentHTML('beforeend', '<br>' + msg); })
      .catch(function (err) { $('homeNote').textContent = err.message; });
  }
  $('homeSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; var v = b.getAttribute('data-v'); if (v === homeMode) return;
    if (v === 'open' && !openArm) { openArm = true; b.textContent = 'tap again to open'; setTimeout(function () { openArm = false; b.textContent = 'open'; }, 3000); return; }
    openArm = false; b.textContent = v; homeMode = v; saveHome(v === 'open' ? 'saved — the work is live within about 20 seconds.' : 'saved — back to “soon” within about 20 seconds.');
  });
  $('homeLine').addEventListener('change', function () { saveHome('saved.'); });

  var pulseSig = null, pulseT = null;
  function liveState(on) { $('live').classList.toggle('off', !on); $('live').title = on ? 'live' : 'reconnecting…'; }
  function pulse() {
    clearTimeout(pulseT); if (!session) return;
    call('/pulse').then(function (j) {
      var sig = j.total + '|' + j.last;
      if (pulseSig === null ? (shownTotal !== null && j.total !== shownTotal) : sig !== pulseSig) load();
      pulseSig = sig; liveState(true);
    }).catch(function () { liveState(false); })
      .then(function () { if (session) pulseT = setTimeout(pulse, document.hidden ? 15000 : 3000); });
  }
  $('out').addEventListener('click', function () { signOut(''); });
  $('addDev').addEventListener('click', function () {
    var b = this; b.disabled = true; status('');
    ceremony('register', {}).then(function () { status('added — next time, just ' + BIO + '.'); load(); })
      .catch(function (err) { status(deviceError(err), true); }).then(function () { b.disabled = false; });
  });
  var armed = null;
  $('devList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rm]'); if (!b) return;
    if (armed !== b) { if (armed) armed.textContent = 'remove'; armed = b; b.textContent = 'tap again to remove'; return; }
    b.disabled = true;
    call('/passkey/remove', { method: 'POST', body: { id: b.getAttribute('data-rm') } }).then(function () { status(b.getAttribute('data-name') + ' removed.'); armed = null; load(); })
      .catch(function (err) { status(err.message, true); b.disabled = false; });
  });
  $('test').addEventListener('click', function () {
    var b = this; b.disabled = true; status('sending…');
    call('/test-alert', { method: 'POST' }).then(function (j) { status('sent to ' + j.to + ' — check your inbox (and promotions / spam the first time).'); })
      .catch(function (err) { status(err.message, true); }).then(function () { b.disabled = false; });
  });
  $('csv').addEventListener('click', function () {
    var b = this; b.disabled = true;
    call('/csv' + (PROD ? '?product=' + PROD : ''), { raw: true }).then(function (r) { return r.blob(); }).then(function (blob) {
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = (PROD || 'all') + '-beta-list-' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }).catch(function (err) { status(err.message, true); }).then(function () { b.disabled = false; });
  });
  /* ── which beta the list shows ── */
  function segUI() { [].forEach.call(document.querySelectorAll('#seg button'), function (b) { b.classList.toggle('on', b.getAttribute('data-p') === PROD); }); $('csv').textContent = PROD ? 'download ' + PROD + ' csv' : 'download csv'; }
  $('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    PROD = b.getAttribute('data-p'); try { localStorage.setItem('syc_admin_prod', PROD); } catch (x) {}
    segUI(); load();
  });
  segUI();
  /* ── tabs ── */
  var TAB = 'list'; try { TAB = localStorage.getItem('syc_admin_tab') || 'list'; } catch (e) {}
  function showTab(t) {
    TAB = t; try { localStorage.setItem('syc_admin_tab', t); } catch (e) {}
    if (t === 'list') { var bd = document.querySelector('.tab[data-tab=list] .badge'); if (bd) bd.remove(); }
    [].forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
    $('pane-list').hidden = t !== 'list'; $('pane-visits').hidden = t !== 'visits'; $('pane-page').hidden = t !== 'page';
    $('pane-site').hidden = t !== 'site'; $('pane-shop').hidden = t !== 'shop'; $('savebar').hidden = t !== 'site' && t !== 'shop';
    $('devs').hidden = t === 'site' || t === 'shop';
    if (t === 'visits') loadStats(); if (t === 'page') loadCfg(); if (t === 'site' || t === 'shop') loadContent(); if (t === 'site') loadHome();
  }
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) showTab(b.getAttribute('data-tab')); });

  /* ── visits ── */
  var SRC = { ig: 'Instagram', direct: 'direct / typed', google: 'Google', x: 'X', tiktok: 'TikTok', youtube: 'YouTube', site: 'gualo.site', test: 'test' };
  function loadStats() {
    return call('/stats').then(function (j) {
      var t = j.totals; $('v7').textContent = t.home7 + t.beta7 + (t.vhs7 || 0);
      $('vnums').innerHTML = [[t.beta7, 'beta page · 7 days'], [t.home7, 'gualo.site · 7 days'], [t.beta30 + t.home30, 'visits · 30 days'],
        [t.vhs7 || 0, 'vhs page · 7 days'], [t.signups30, 'joined the list · 30 days'], [t.beta30 ? Math.round(100 * t.signups30 / t.beta30) + '%' : '–', 'of beta-page visits joined']]
        .map(function (n) { return '<div><b>' + n[0] + '</b><span>' + n[1] + '</span></div>'; }).join('');
      var max = Math.max(1, Math.max.apply(null, j.days.map(function (d) { return d.home + d.beta; })));
      $('bars').innerHTML = j.days.map(function (d, i) {
        var tot = d.home + d.beta;
        return '<div class="bar' + (i === j.days.length - 1 ? ' today' : '') + '" style="height:' + (100 * tot / max).toFixed(1) + '%" title="' + d.day + ' · ' + d.beta + ' beta page · ' + d.home + ' gualo.site"><i style="height:' + (tot ? 100 * d.beta / tot : 0).toFixed(1) + '%"></i></div>';
      }).join('');
      var lab = function (day) { var p = day.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
      $('axis').innerHTML = '<span>' + lab(j.days[0].day) + '</span><span>' + lab(j.days[15].day) + '</span><span>today</span>';
      var top = Math.max(1, j.sources.length ? j.sources[0].visits : 1);
      $('srcs').innerHTML = j.sources.length ? j.sources.slice(0, 8).map(function (r) {
        return '<div class="src"><span>' + esc(SRC[r.source] || r.source) + '</span><span class="track"><i style="width:' + (100 * r.visits / top).toFixed(1) + '%"></i></span><b>' + r.visits + '</b></div>';
      }).join('') : '<div class="empty">no visits counted yet.</div>';
      $('vstatus').textContent = '';
    }).catch(function (err) { if (err.message !== 'signed out') { $('vstatus').textContent = err.message; } });
  }

  /* ── beta page settings ── */
  var LOOPS = [{ name: 'forest', mp4: '/sycstem/bg/forest.mp4', f: 'blur(5px) saturate(.85) contrast(.45) brightness(1.75)' },
               { name: 'glitch', mp4: '/sycstem/bg/glitch.mp4', f: 'blur(5px) saturate(.85) contrast(.55) brightness(1.5)' }];
  var cfgSign = 'open';
  $('cLoops').innerHTML = LOOPS.map(function (l) {
    return '<label class="loop on" data-loop="' + l.name + '"><video muted loop playsinline autoplay preload="metadata" src="' + l.mp4 + '" style="filter:' + l.f + '"></video><input type="checkbox" checked><span>' + l.name + '</span></label>';
  }).join('');
  $('cLoops').addEventListener('change', function (e) { var lab = e.target.closest('.loop'); if (lab) lab.classList.toggle('on', e.target.checked); });
  function setSign(v) { cfgSign = v; [].forEach.call($('cSign').children, function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); }); }
  $('cSign').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setSign(b.getAttribute('data-v')); });
  function loadCfg() {
    return call('/config').then(function (j) {
      var t = j.teaser; $('cLine').value = t.line; $('cAsk').value = t.ask || ''; $('cFine').value = t.fine; setSign(t.signups);
      [].forEach.call(document.querySelectorAll('.loop'), function (lab) { var on = t.loops.indexOf(lab.getAttribute('data-loop')) >= 0; lab.classList.toggle('on', on); lab.querySelector('input').checked = on; });
      $('cstatus').textContent = '';
    }).catch(function (err) { if (err.message !== 'signed out') $('cstatus').textContent = err.message; });
  }
  $('fCfg').addEventListener('submit', function (e) {
    e.preventDefault();
    var loops = [].filter.call(document.querySelectorAll('.loop'), function (l) { return l.querySelector('input').checked; }).map(function (l) { return l.getAttribute('data-loop'); });
    var b = $('cSave'); b.disabled = true; var st = $('cstatus'); st.className = 'status'; st.textContent = 'saving…';
    call('/config', { method: 'POST', body: { teaser: { line: $('cLine').value, ask: $('cAsk').value, fine: $('cFine').value, loops: loops, signups: cfgSign } } })
      .then(function () { st.textContent = 'saved — the page shows it within about 20 seconds.'; })
      .catch(function (err) { st.textContent = err.message; st.className = 'status bad'; }).then(function () { b.disabled = false; });
  });

  /* ── site + shop: the homepage's content (portfolio, clients, plugin text, shop) ── */
  var model = null, dirty = false, loadingC = null;
  function loadContent(force) {
    if (model && !force) { renderEd(); return Promise.resolve(); }
    if (loadingC) return loadingC;
    loadingC = call('/content').then(function (j) {
      if (j.content) return j.content;
      return fetch('/content.json', { cache: 'no-store' }).then(function (r) { return r.json(); });   // never edited: the page's own copy
    }).then(function (c) { model = c; setDirty(false); renderEd(); })
      .catch(function (err) { if (err.message !== 'signed out') smsg(err.message, true); })
      .then(function () { loadingC = null; });
    return loadingC;
  }
  function smsg(t, bad) { var m = $('sMsg'); m.textContent = t || ''; m.className = 'msg' + (bad ? ' bad' : ''); }
  function setDirty(d) { dirty = d; $('sSave').disabled = !d; smsg(d ? 'unsaved changes' : ''); }
  window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  function at(path) { return path.split('.').reduce(function (o, k) { return o == null ? o : o[/^\d+$/.test(k) ? +k : k]; }, model); }
  function parentOf(path) { var p = path.split('.'), k = p.pop(); return { obj: at(p.join('.')), key: /^\d+$/.test(k) ? +k : k }; }
  var A = function (v) { return esc(v == null ? '' : v); };
  var GLY = ['grid', 'wave', 'drop', 'noise', 'petal'];
  function fld(path, ph, cls) { return '<input class="fld' + (cls ? ' ' + cls : '') + '" data-f="' + path + '" value="' + A(at(path)) + '" placeholder="' + A(ph) + '" aria-label="' + A(ph) + '">'; }
  function ctl(path, n) { return '<button class="ib" type="button" data-act="mv" data-p="' + path + '" data-d="-1" aria-label="move back">' + (n ? '↑' : '←') + '</button><button class="ib" type="button" data-act="mv" data-p="' + path + '" data-d="1" aria-label="move on">' + (n ? '↓' : '→') + '</button><button class="ib warn" type="button" data-act="rm" data-p="' + path + '">remove</button>'; }
  function thumb(src, label) { return '<div class="th">' + (src ? '<img src="' + A(src) + '" alt="" loading="lazy">' : A(label || 'no photo')) + '</div>'; }

  function renderEd() {
    if (!model) return;
    // site
    var h = '<h3>portfolio — sections in the order they show</h3>';
    model.work.forEach(function (sec, i) {
      var P = 'work.' + i;
      h += '<div class="sec"><div class="bar">' + fld(P + '.title', 'section title', 'big') + ctl(P, true) + '</div>' +
        '<div class="bar">' + fld(P + '.note', 'small note (optional)') +
        '<label class="chk"><input type="checkbox" data-f="' + P + '.gallery"' + (sec.gallery ? ' checked' : '') + '> photo gallery</label></div><div class="items">';
      sec.items.forEach(function (it, k) {
        var Q = P + '.items.' + k;
        h += '<div class="it">' + thumb(it.src, it.code || it.med) + fld(Q + '.code', 'caption') + fld(Q + '.href', 'link (optional)') +
          '<div class="row"><button class="ib" type="button" data-act="photo" data-p="' + Q + '">' + (it.src ? 'replace' : 'photo') + '</button>' + ctl(Q) + '</div>' +
          '<label class="chk"><input type="checkbox" data-f="' + Q + '.video"' + (it.video ? ' checked' : '') + '> video link</label></div>';
      });
      h += '</div><button class="ib add" type="button" data-act="addph" data-p="' + P + '">+ add photos</button><button class="ib add" type="button" data-act="additem" data-p="' + P + '">+ add a link tile</button></div>';
    });
    h += '<button class="btn add" type="button" data-act="addsec">+ new section</button>';
    h += '<h3>clients</h3><div class="sec"><div class="items">';
    model.clients.forEach(function (c, i) {
      var P = 'clients.' + i;
      h += '<div class="it">' + thumb(c.logo, c.name) + fld(P + '.name', 'name') + '<div class="row"><button class="ib" type="button" data-act="logo" data-p="' + P + '">' + (c.logo ? 'logo' : '+ logo') + '</button>' + ctl(P) + '</div></div>';
    });
    h += '</div><button class="ib add" type="button" data-act="addclient">+ add a client</button></div>';
    h += '<h3>plugin pages (the SYCSTEM windows)</h3>';
    Object.keys(model.plugins || {}).forEach(function (k) {
      h += '<div class="sec"><div class="lbl" style="text-align:left;font-size:11px;letter-spacing:.08em;color:var(--fine)">' + A(k) + '</div>' + fld('plugins.' + k + '.tag', 'one line') +
        '<textarea class="fld" data-f="plugins.' + k + '.desc" aria-label="description">' + A(model.plugins[k].desc) + '</textarea></div>';
    });
    $('edSite').innerHTML = h;
    // shop
    var g = '<div class="sec" style="align-items:center"><div class="lbl" style="font-size:11px;letter-spacing:.08em;color:var(--fine)">the shop on gualo.site</div>' +
      '<div class="seg" id="shopSeg"><button type="button" data-v="on" class="' + (model.shopOn ? 'on' : '') + '">on</button><button type="button" data-v="off" class="' + (model.shopOn ? '' : 'on') + '">off</button></div>' +
      '<div class="msg" style="font-size:12px;color:var(--fine);text-align:center">' + (model.shopOn ? 'a “Shop” link shows next to Clients.' : 'hidden — nobody can open it.') + '</div></div>';
    model.shop.forEach(function (sec, i) {
      var P = 'shop.' + i;
      g += '<div class="sec"><div class="bar">' + fld(P + '.title', 'shelf title', 'big') + ctl(P, true) + '</div><div class="bar">' + fld(P + '.note', 'small note (optional)') + '</div><div class="items">';
      sec.items.forEach(function (it, k) {
        var Q = P + '.items.' + k;
        g += '<div class="it">' + thumb(it.src, it.name) + fld(Q + '.name', 'name') + fld(Q + '.price', 'price') + fld(Q + '.cta', it.soon ? 'button (Soon)' : 'button (Beta)') + fld(Q + '.href', 'buy link (optional)') +
          '<label class="chk"><input type="checkbox" data-f="' + Q + '.soon"' + (it.soon ? ' checked' : '') + '> coming soon</label>' +
          (it.src ? '' : '<select class="fld" data-f="' + Q + '.glyph" aria-label="symbol">' + GLY.map(function (x) { return '<option' + (it.glyph === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>') +
          '<div class="row"><button class="ib" type="button" data-act="photo" data-p="' + Q + '">' + (it.src ? 'replace' : 'photo') + '</button>' + (it.src ? '<button class="ib" type="button" data-act="nophoto" data-p="' + Q + '">no photo</button>' : '') + ctl(Q) + '</div></div>';
      });
      g += '</div><button class="ib add" type="button" data-act="addprod" data-p="' + P + '">+ add a product</button></div>';
    });
    g += '<button class="btn add" type="button" data-act="addshelf">+ new shelf</button>';
    $('edShop').innerHTML = g;
  }

  function onField(e) {
    var el = e.target, p = el.getAttribute('data-f'); if (!p || !model) return;
    var t = parentOf(p);
    if (el.type === 'checkbox') { if (el.checked) t.obj[t.key] = true; else delete t.obj[t.key]; }
    else if (el.value === '' && /\.(href|cta|note|med)$/.test(p)) delete t.obj[t.key];
    else t.obj[t.key] = el.value;
    setDirty(true);
    if (el.type === 'checkbox' && /\.soon$/.test(p)) renderEd();
  }
  ['edSite', 'edShop'].forEach(function (id) { $(id).addEventListener('input', onField); $(id).addEventListener('change', function (e) { if (e.target.type === 'checkbox' || e.target.tagName === 'SELECT') onField(e); }); });

  // photos: shrink in the browser (≤ 2400 px), upload, then use
  function shrink(file) {
    return createImageBitmap(file).then(function (bmp) {
      var k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
      var c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(bmp, 0, 0, w, h);
      var type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      return new Promise(function (res) { c.toBlob(function (b) { res({ blob: b, w: w, h: h, type: type }); }, type, .86); });
    });
  }
  function upload(file) {
    return shrink(file).then(function (s) {
      return fetch(API + '/media?w=' + s.w + '&h=' + s.h, { method: 'POST', headers: { 'Content-Type': s.type, Authorization: 'Bearer ' + session.token }, body: s.blob })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || 'upload failed'); return j; }); });
    });
  }
  var pickFor = null;
  $('pick').addEventListener('change', function () {
    var files = [].slice.call(this.files || []); this.value = ''; if (!files.length || !pickFor) return;
    var job = pickFor; pickFor = null; smsg('uploading ' + files.length + ' photo' + (files.length > 1 ? 's' : '') + '…');
    var chain = Promise.resolve();
    files.forEach(function (f) { chain = chain.then(function () { return upload(f).then(function (u) { job(u); renderEd(); }); }); });
    chain.then(function () { setDirty(true); smsg('photos in — press save to put them live.'); }).catch(function (err) { smsg(err.message, true); });
  });
  var shape = function (u) { return { ar: u.w + '/' + u.h, nw: Math.round(1500 * u.w / Math.max(u.w, u.h)) }; };
  var armedRm = null;
  function onAct(e) {
    var b = e.target.closest('[data-act]'); if (!b || !model) return;
    var act = b.getAttribute('data-act'), p = b.getAttribute('data-p');
    if (act === 'mv') { var t = parentOf(p), arr = t.obj, i = t.key, j = i + (+b.getAttribute('data-d')); if (j < 0 || j >= arr.length) return; var x = arr[i]; arr[i] = arr[j]; arr[j] = x; }
    else if (act === 'rm') { if (armedRm !== b) { if (armedRm) armedRm.textContent = 'remove'; armedRm = b; b.textContent = 'sure?'; return; } var r = parentOf(p); r.obj.splice(r.key, 1); armedRm = null; }
    else if (act === 'photo' || act === 'logo') {
      var target = at(p); pickFor = function (u) { if (act === 'logo') target.logo = u.url; else { target.src = u.url; if (!/^shop/.test(p)) { var s2 = shape(u); target.ar = s2.ar; target.nw = s2.nw; } } };
      $('pick').multiple = false; $('pick').click(); return;
    }
    else if (act === 'addph') { var sec = at(p); pickFor = function (u) { var s3 = shape(u); sec.items.push({ ar: s3.ar, nw: s3.nw, src: u.url, code: '' }); }; $('pick').multiple = true; $('pick').click(); return; }
    else if (act === 'nophoto') { delete at(p).src; }
    else if (act === 'additem') at(p).items.push({ ar: '16/9', code: 'new link', href: '' });
    else if (act === 'addsec') model.work.push({ key: 'SECTION_' + Date.now().toString(36).toUpperCase(), title: 'New section', note: '', gallery: true, items: [] });
    else if (act === 'addclient') model.clients.push({ name: 'New client', logo: '' });
    else if (act === 'addprod') at(p).items.push({ ar: '4/5', name: 'New product', price: 'Soon', soon: true, glyph: 'petal' });
    else if (act === 'addshelf') model.shop.push({ key: 'SHELF_' + Date.now().toString(36).toUpperCase(), title: 'New shelf', note: '', store: true, items: [] });
    setDirty(true); renderEd();
  }
  ['edSite', 'edShop'].forEach(function (id) { $(id).addEventListener('click', onAct); });
  $('edShop').addEventListener('click', function (e) { var b = e.target.closest('#shopSeg button'); if (!b) return; model.shopOn = b.getAttribute('data-v') === 'on'; setDirty(true); renderEd(); });
  $('sSave').addEventListener('click', function () {
    var b = this; b.disabled = true; smsg('saving…');
    call('/content', { method: 'POST', body: { content: model } }).then(function (j) { model = j.content; setDirty(false); renderEd(); smsg('saved — live on gualo.site within about 15 seconds.'); })
      .catch(function (err) { smsg(err.message, true); b.disabled = false; });
  });
  var undoArm = false;
  $('sUndo').addEventListener('click', function () {
    var b = this; if (!undoArm) { undoArm = true; b.textContent = 'tap again to undo'; setTimeout(function () { undoArm = false; b.textContent = 'undo last save'; }, 3000); return; }
    undoArm = false; b.textContent = 'undo last save'; smsg('undoing…');
    call('/content', { method: 'POST', body: { undo: true } }).then(function () { model = null; return loadContent(true); }).then(function () { smsg('back to the previous save.'); })
      .catch(function (err) { smsg(err.message, true); });
  });

  // keep it current while it's open
  setInterval(function () { if (session && !document.hidden && TAB === 'visits') loadStats(); }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { unseen = 0; document.title = baseTitle; if (session) { pulse(); play(); } }
  });

  /* start: a reset link, a saved session, or the sign-in */
  function start() {
    var m = location.hash.match(/^#(?:setup|reset)=([\w.-]+)$/);
    note('');
    if (m) { setupToken = m[1]; gate('setup'); }
    else if (session && session.token) room();
    else gate('login');
  }
  start();
  window.addEventListener('hashchange', start); // the setup link opened in a tab that already had the page
})();
</script>
</body>
</html>
