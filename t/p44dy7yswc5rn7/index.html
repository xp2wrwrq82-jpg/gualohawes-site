<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#000000">
<title>SYCSTEM</title>
<!-- BETA INTRO TAPE PAGE 0.1.0 (draft). One tape, nothing else. Lives at a hidden path on gualo.site; nothing links to it but the email. -->
<style>
  html,body{margin:0;height:100%;background:#000;}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .tape{position:relative;width:min(100vw,calc(100dvh * 4 / 3));aspect-ratio:4/3;background:#000;}
  video{display:block;width:100%;height:100%;object-fit:contain;background:#000;}
  button{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  button:focus-visible{outline:1px solid #E22C1A;outline-offset:-8px;}
  .tape.on button{display:none;}
</style>
</head>
<body>
<div class="tape" id="tape">
  <video id="v" src="tape.mp4" poster="poster.jpg" playsinline preload="metadata"></video>
  <button id="b" aria-label="Play the tape"></button>
</div>
<script>
  var t=document.getElementById('tape'),v=document.getElementById('v');
  document.getElementById('b').addEventListener('click',function(){t.classList.add('on');v.play();});
  v.addEventListener('ended',function(){v.pause();});   // it stops on black; nothing follows
</script>
</body>
</html>
